# After CI passes on master: update the Oracle VM, upload web/out to Vercel,
# then check both live sites really run this commit. Fails loudly if not.
# The VM job skips itself until the setup below is done; a warning then says if the live API is behind.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions). Full guide: docs/SETUP.md
#   secrets   VM_HOST, VM_USER, VM_SSH_KEY (private key), VERCEL_TOKEN (vercel.com/account/tokens)
#   variables VM_APP_DIR (repo folder on the VM), VM_RESTART (e.g. "sudo systemctl restart sales-bot"),
#             SITE_URL (e.g. "https://your-app.vercel.app")
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  vm:
    if: vars.VM_APP_DIR != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Pull master and restart the API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.VM_APP_DIR }}"
            git fetch origin master
            git checkout master
            git merge --ff-only origin/master
            ${{ vars.VM_RESTART }}
      - name: Check the API runs this commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for i in $(seq 1 20); do
            v=$(curl -fsS https://140-238-102-50.sslip.io/api/health | jq -r .version || true)
            [ "$v" = "$SHA" ] && echo "API live on $v" && exit 0
            sleep 6
          done
          echo "API still runs '$v', expected $SHA"; exit 1

  vm-not-set-up:
    # without VM_APP_DIR the vm job skips and the run still reads green while the live API stays old
    if: vars.VM_APP_DIR == '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Warn when the live API is not this commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          v=$(curl -fsS https://140-238-102-50.sslip.io/api/health | jq -r .version || echo unreachable)
          if [ "$v" = "$SHA" ]; then echo "API live on $v"; exit 0; fi
          echo "::warning title=API not deployed::VM_APP_DIR is not set, so the VM was not updated. Live API runs '$v', master is $SHA. Deploy by hand or set the variables (docs/SETUP.md)."

  web:
    if: vars.SITE_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_1dnaG1QOb0ATRNLYbKwA00nY
      VERCEL_PROJECT_ID: prj_QEXJuv3B7Ak8fHPhFNYVYJYagztr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Upload the built pages (web/out) to Vercel
        working-directory: web/out
        run: npx --yes vercel@59 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Check the site serves the current pages
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.SITE_URL }}/buy/")
            [ "$code" = "200" ] && echo "site live" && exit 0
            sleep 10
          done
          echo "/buy/ still returns $code"; exit 1
