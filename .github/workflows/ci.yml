# Every pull request and push: the same checks a contributor runs locally.
# A red run means the change is not ready to merge.
name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint (errors that would crash at run time)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - name: Types, lint, unit checks
        run: npm run check
      - name: Build
        run: npm run build
