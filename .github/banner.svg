<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="130" font-size="72" font-weight="700" fill="#f8fafc">Eloquence</text>
    <rect x="82" y="152" width="140" height="6" rx="3" fill="url(#accent)"/>
    <text x="80" y="205" font-size="28" fill="#cbd5e1">Practise the sales call against an AI buyer.</text>
    <text x="80" y="245" font-size="28" fill="#cbd5e1">See exactly where the deal was won or lost.</text>
  </g>
  <g transform="translate(930 60)">
    <rect x="0" y="0" width="200" height="56" rx="16" fill="#334155"/>
    <text x="20" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e2e8f0">It's too expensive.</text>
    <rect x="-40" y="72" width="220" height="56" rx="16" fill="#059669"/>
    <text x="-22" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ecfdf5">Compared to what?</text>
  </g>
</svg>
