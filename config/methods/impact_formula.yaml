# Impact Formula: the app's consultative flow (intent, problem, stakes, pitch) as a script.
# Questions were ported from the app's earlier prompt-driven consultative flow.
# draft: true = a line on that step is not verbatim from the source and needs the coach's wording.
# draft is an authoring marker only: the app ignores it.
first: "intent"
price_step: "present"
# Objections after the price run the shared matrix (config/script); `exits` lead back into this script.
objection_handling: objection_matrix
exits: {resell: "payment", payment: "payment", follow_up: "later"}
# Said before a question asked again once its probes ran out, in turn. draft: ours.
reask: ["No rush, even a rough idea helps.", "Just your best guess is fine."]
steps:
  "intent":
    ui_stage: intent
    say: "What would you like help with first?"
    capture: goal
    echo: true   # their words go back into later lines as they said them
    listen:
      any: {then: "problem"}
  "problem":
    ui_stage: logical
    say: "What's felt hardest to figure out so far?"
    capture: problem
    echo: true
    doubts_answer: true   # money, time, fear are the answer here, not objections
    listen:
      any: {then: "duration"}
  "duration":
    ui_stage: logical
    say: "How long have you been dealing with that?"
    capture: duration
    listen:
      any: {then: "change"}
  "change":
    ui_stage: logical
    draft: true
    say: "What would you change about {problem}, if you could?"
    say_plain: "What would you change about that, if you could?"
    capture: change
    listen:
      any: {then: "impact"}
  "impact":
    ui_stage: logical
    draft: true
    say: "Has {problem} had an impact on {goal}?"
    say_plain: "Has that had an impact on what you are after?"
    capture: impact
    listen:
      any: {then: "why_now"}
  "why_now":
    ui_stage: emotional
    say: "What's shifted now?"
    capture: why_now
    listen:
      any: {then: "future"}
  "future":
    ui_stage: emotional
    draft: true
    say: "Let's say there was a way to help you solve {problem}... what would tangibly be different for you at that point?"
    say_plain: "Let's say there was a way to help you solve that... what would tangibly be different for you at that point?"
    capture: future
    listen:
      any: {then: "inaction"}
  "inaction":
    ui_stage: emotional
    draft: true
    say: "So on the flip side... what happens if you don't change? Like, if we continue down the current path with {problem} for 2 weeks, 2 months, 2 years even?"
    say_plain: "So on the flip side... what happens if you don't change? Like, if we continue down the current path for 2 weeks, 2 months, 2 years even?"
    capture: cost
    listen:
      any: {then: "feeling"}
  "feeling":
    ui_stage: emotional
    say: "And how would you feel at that point?"
    listen:
      any: {then: "commit"}
  "commit":
    ui_stage: pitch
    say: "Why now? Why actually make that change?"
    capture: reason
    listen:
      any: {then: "present"}
  "present":
    ui_stage: pitch
    draft: true
    say: "Based on {goal} and {problem}, here's why this fits: {pillar_1}, {pillar_2} and {pillar_3}. It's a {months}-month process and the investment is {price}. How does this get you to {goal}?"
    say_plain: "Here's why this fits: {pillar_1}, {pillar_2} and {pillar_3}. It's a {months}-month process and the investment is {price}. How does this get you to where you want to be?"
    listen:
      any: {then: "check"}
  "check":
    ui_stage: pitch
    draft: true  # probe is ours: the source has no second wording
    say: "Does that all make sense?"
    probe: "Put simply: a step-by-step plan, someone in your corner, and someone holding you to it. Does that make sense?"
    stuck: {then: "close"}   # still unclear: go to the close, objections handle doubt there
    listen:
      agrees:
        examples:
          - "yes that makes sense"
          - "yeah it all makes sense"
          - "yes, clear"
          - "got it, makes sense"
          - "yeah, I am following you"
        then: "close"
      unclear:
        examples:
          - "no, that doesn't make sense"
          - "not really, I'm confused"
          - "I'm not sure I follow"
          - "can you explain that again"
          - "I didn't understand that"
          - "I'm lost"
        then: "check"
  "close":
    ui_stage: pitch
    draft: true  # probe is ours: the source has no second wording
    say: "Do you see yourself jumping in, or how do you feel?"
    probe: "Where are you at with it right now?"
    stuck: {then: "m_identify"}   # still hesitant: find what holds them back (the objection matrix)
    listen:
      agrees:
        examples:
          - "yes I'm ready to jump in"
          - "yes let's do it"
          - "I'm in, I can see myself doing this"
          - "yes I see myself taking the jump"
        then: "payment"
      hesitant:
        examples:
          - "no, not really"
          - "I'm not sure I'm ready"
          - "I don't see myself doing this"
          - "not right now"
          - "I can't see that happening"
          - "maybe, I'm not sure yet"
        then: "close"
  "payment":
    ui_stage: outcome
    say: "How would you like to process the investment? Credit or debit?"
  "later":
    name: "Follow-up"
    ui_stage: outcome
    draft: true  # the coach's FAQ says book the follow-up and leave on a good note; no wording
    say: "No problem. Let's book a follow-up call so you can decide properly, and I'll leave it there for today."
