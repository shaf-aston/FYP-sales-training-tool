# CAT call script, steps 00-22. Lines are the operator's script verbatim.
# {blank} = filled from the prospect's own answers (the script's XYZ) or from the offer.
# draft: true = a line on that step is not verbatim from the source and needs the coach's wording.
# draft is an authoring marker only: the app ignores it.
first: "00"
price_step: "14"
revisit_step: "19"   # an objection parked before the price comes back when they hesitate at the soft close
# Objections after the price run the shared matrix (config/script); `exits` lead back into this script.
objection_handling: objection_matrix
exits: {resell: "20", payment: "22", follow_up: "later"}
# A keen prospect who says they're in before the pitch is asked one question, then shown how to pay
# (coach: "just send the payment link, make it easy"). From the soft close on, the script closes itself.
ready:
  then: "ready"
  until: "19"
  min_score: 0.8   # long, specific examples: "I'm in sales" or "yes" must never jump
  examples:
    - "I'm in, send me the payment link"
    - "I'm ready to buy, how do I pay"
    - "I already know I want to join, how do I pay"
    - "where do I sign up, I want to join"
    - "how do I sign up"
    - "just send me the link to pay"
    - "yes I'm in, how do I pay"        # draft: these two hear "yes I'm in" (0.87), never "sounds good" (0.77),
    - "yes I'm in, send me the link"    # draft: "I'm in sales" (0.70) or "I want to join the people who made it" (0.78)
# Said before a question asked again once its probes ran out, in turn: the same line twice in a row
# reads like a bot. draft: ours, the source has no wording for this.
reask: ["No rush, even a rough idea helps.", "Just your best guess is fine.", "Whatever comes to mind first."]   # draft: the third lead is ours
steps:
  "00":
    name: "Frame"
    ui_stage: intent
    draft: true
    run_on: true   # the frame leads straight into step 01's question
    say: "I believe you had a chat with {setter} setter... I've read your application but I don't like to assume anything."
    say_plain: "I've read your application but I don't like to assume anything."
    listen:
      any: {then: "01"}
  # Goals come in three levels, and 01 digs down them one rung at a time:
  #   1 surface   what they say first: more money, financial / time / location freedom, quit the 9-5
  #   2 practical what that does for them day to day: no stress buying things, bills paid, time with the kids
  #   3 identity  who it makes them, the transformation: a provider, proud of themselves, someone free
  # A surface answer gets the formula "What are you hoping to achieve with {their words}?"; an answer
  # already at level 2 or 3 skips the rungs it has climbed.
  "01":
    name: "End outcome"
    note: 'Level 1 (surface): more money, freedom. Take it, then dig to level 2 and 3'
    ui_stage: intent
    draft: true  # the probe is ours: the source only says "dig"
    say: "What do you want to specifically achieve by making money online?"
    bridge: "Just out of curiosity, have you tried making money online before?"   # draft: asked after a short "who are you" answer at the very start; the owner's wording to follow
    capture: outcome
    echo: true   # "financial freedom" goes back into the next lines as they said it
    probe:   # asked in turn; then `stuck` moves on after `misses` (engine.yaml) instead of asking forever
      - "What are you actually hoping to achieve?"
    stuck: {then: "goal_practical"}
    unsure: surface   # too close to call between levels ("not stuck in a 9 to 5"): dig one rung, never ask again
    listen:
      surface:   # level 1: kept as their outcome, then dug into
        examples: &surface
          - "more money"
          - "I want to make more money"
          - "I want financial freedom"
          - "I want to be free from my 9-5 and work from anywhere"
          - "I want time freedom so I can travel and choose my own schedule"
          - "location freedom"
          - "travel the world"
          - "I want to quit my job and be my own boss"
          - "freedom to do what I want with my days"
        then: "goal_practical"
      practical:   # level 2 already: skip the formula, ask the identity rung
        examples: &practical
          - "so I can stop stressing every time I buy something"
          - "to pay off my debts and stop worrying about bills"
          - "I want more time with my kids and family"
          - "to spend more time with my family"
          - "so I can help my parents out"
          - "to not have to check my bank balance before buying food"
        then: "goal_identity"
      identity:   # level 3 already: the ladder is climbed
        examples: &identity
          - "I want to be someone my kids can look up to"
          - "I want to finally be proud of myself"
          - "to be the provider for my family I always wanted to be"
          - "to prove to myself I am capable of more"
          - "I want to become my own person and not someone's employee"
        then: "02"
      vague:   # restates the question or names no outcome: ask again, never take it as their goal
        examples:
          - "I want to make money online"
          - "I want to earn online"
          - "not sure really"
          - "I don't know"
        then: "01"
        keep: false   # "not sure really" is not their outcome: never said back to them
  "goal_practical":
    name: "Practical goal"
    note: 'Level 2 (practical): what it does for them day to day, e.g. no stress buying things'
    ui_stage: intent
    draft: true  # the owner's formula, our probe
    say: "What are you hoping to achieve {outcome|with $|by being able to $}?"
    moment: true   # the goal formula: their exact words, whatever the echo budget says
    say_plain: "What are you hoping that would get you?"
    capture: practical
    echo: true
    # Not an answer: a reply made only of shrugs, figures or spans of time ("dunno like 10k", "a while",
    # "like 5 grand"); asked again, then moved on unsaved. A figure is still kept for 02 (`answered_by`).
    needs: &a_goal '^(?!\W*(?:(?:dunno|idk|i\s+don''?t\s+know|not\s+sure|like|about|around|maybe|probably|roughly|um+|uh+|hmm+|lol|ig|i\s+guess|a\s+while|ages|a\s+long\s+time|for\s+ages|forever|[$£€]?\d[\d,.]*\s*(?:k|grand|thousand|years?|months?|weeks?)?|(?:a|one|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|forty|fifty|few|couple)\s+(?:grand|thousand|k|years?|months?|weeks?))(?:\W+(?:dunno|idk|i\s+don''?t\s+know|not\s+sure|like|about|around|maybe|probably|roughly|um+|uh+|hmm+|lol|ig|i\s+guess|a\s+while|ages|a\s+long\s+time|for\s+ages|forever|[$£€]?\d[\d,.]*\s*(?:k|grand|thousand|years?|months?|weeks?)?|(?:a|one|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|forty|fifty|few|couple)\s+(?:grand|thousand|k|years?|months?|weeks?)))*)?\W*$)'
    probe:
      - "What would that actually change for you, day to day?"
    # "financial freedom" again is a real answer, just not deeper: "No rush" would read as if they said nothing
    reask: ["Picture you already had it."]   # draft: ours
    stuck: {then: "goal_identity"}
    listen:
      surface:   # still level 1 ("more money" again): asked another way, not taken
        examples: *surface
        then: "goal_practical"
        keep: false
      practical: {examples: *practical, then: "goal_identity"}   # a rival label, so a level 2 answer is never heard as level 1
      identity: {examples: *identity, then: "02"}
      any: {then: "goal_identity"}
  "goal_identity":
    name: "Identity goal"
    note: 'Level 3 (identity): who it makes them, the transformation as a person'
    ui_stage: intent
    draft: true  # ours: the owner named the level, not the words
    say: "And what would that change about you, as a person?"
    capture: identity
    echo: true
    needs: *a_goal
    probe:
      - "Who would you be, once that's real?"
    stuck: {then: "02"}
    listen:
      any: {then: "02"}
  "02":
    name: "Number"
    ui_stage: logical
    draft: true
    say: "How much would you need to be making each month {outcome|to have $|to $}?"
    say_plain: "How much would you need to be making each month to make that happen?"
    plain_if: '\bmoney\b|\bcash\b|\brich\b'   # "to make more money" after "how much each month" asks money for money
    capture: number
    # A reply with no figure ("I don't know where to start") is not the answer: asked again, then moved on unsaved.
    needs: '\d|\b(?:two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|forty|fifty|hundred|thousand|grand|million)\b'   # not "one": "no one knows" is no figure
    probe:   # draft: ours, so a reply with no figure gets an easier question, not the same one
      - "If you had to put a number on it, what would you want coming in each month?"
    stuck: {then: "03"}
    # "I want 5k a month" (or a reply that is only the figure, "about 5k a month", "like 5 grand") said earlier answers this step,
    # so it is skipped. Otherwise needs a want/need word,
    # only "to make / be earning / around"-type words, then the figure and "a month": "I make 2k a month",
    # "a job paying 2k a month", "I need to save 200 a month" and "I don't want ..." are not the goal.
    answered_by: '(?:(?<!n''t )(?<!not )\b(?:want|need|aim|aiming|hoping|looking|goal|target|(?<=to |nd )have|having)(?:\s+(?:to|be|make|making|earn|earning|bring|bringing|in|about|around|at|least|like|roughly|for|of|is|maybe|ideally|say|minimum))*\s+|^\W*(?P<bare>)(?:(?:about|around|roughly|maybe|probably|like|say|ideally|at least|i''d say|dunno|idk|i guess)\s+)*)(?P<answer>(?:[$£€]?\d[\d,.]*\s*(?:k|grand|thousand)?|(?:a|one|two|three|four|five|six|seven|eight|nine|ten|fifteen|twenty|thirty|forty|fifty)\s+(?:grand|thousand|k))\s*(?:a|per|each|every|/)\s*(?:month|mo)\b|(?(bare)(?:[$£€]?\d[\d,.]*\s*(?:k|grand|thousand)|(?:a|one|two|three|four|five|six|seven|eight|nine|ten|fifteen|twenty|thirty|forty|fifty)\s+(?:grand|thousand|k))|(?!)))(?(bare)\W*$)'
    listen:
      any: {then: "03"}
  "03":
    name: "Time"
    ui_stage: logical
    say: "How long have you been thinking about this?"
    capture: years
    # A span of time: "nothing" or "time" is no answer to how long ("about 3 years", "since covid", "ages" are).
    needs: '\d|\b(?:since|ages|while|long|forever|always|ever|recently|lately|life|bit|days?|weeks?|months?|years?|yrs?|decades?)\b'
    probe:   # draft: ours, so "I don't know" gets an easier question, not the same one
      - "Roughly, is it more like months, or a few years?"
    stuck: {then: "04"}
    listen:
      failed_before:   # a past failed attempt is acknowledged before the script goes on
        min_score: 0.7   # "since my dad got sick" (0.66) is a hard time, not a failed attempt: the meaning bank answers it
        examples:
          - "I tried dropshipping and it failed"
          - "I've tried a few things online and lost money"
          - "I started a business before but it didn't work out"
          - "I gave it a go and it flopped"
        then: "03"   # still asked how long: 04 says "so many nights, months and years" as if they told us
        keep: false
        ack: "Sorry to hear that, plenty of people have a first attempt that doesn't work out."
      worried:   # a rival label: "I'm scared of losing money" (0.75 to the attempts above) is a worry, not a failed attempt
        draft: true
        examples:
          - "I'm scared of losing money"
          - "I don't want to lose money again"
          - "I'm worried I'll waste my money"
        then: "03"   # still asked how long; the meaning bank says they were heard
        keep: false
      any:
        then: "04"
        ack: "{months_thinking} months... Damn.¶"   # owner's line: their time, in months, before 04 asks why
  "04":
    name: "Contextualise"
    note: 'emotional why. Let them talk'
    ui_stage: emotional
    say: "If this has been on your mind for so many nights, months and years, why can't you just ignore it?"
    capture: why
    probe:   # draft: ours, so "I don't know" gets an easier question, not the same one
      - "What is it about where you are now that you don't want to keep living with?"
    stuck: {then: "05"}
    listen:
      any: {then: "05"}
  "05":
    name: "Blocker"
    note: 'externalising: time, money, market, "still researching", "haven''t found the right thing"'
    ui_stage: emotional
    draft: true
    say: "What's the reason you {outcome|don't have $ yet|haven't managed to $}?"
    say_plain: "What's the reason you haven't got there yet?"
    capture: blocker
    doubts_answer: true   # money, time, fear are the answer here, not objections
    listen:
      any: {then: "06"}
  "06":
    name: "Challenge"
    note: 'little/no action = gap confirmed'
    ui_stage: emotional
    draft: true
    say: "What are you doing now {outcome|to get $ rather than just dream about it|to $ rather than just dream about it}?"
    say_plain: "What are you doing now to make that a reality and not just a dream?"
    capture: action
    probe:   # draft: ours, so "I don't know" gets an easier question, not the same one
      - "Is there anything you've tried so far, even small, like videos or courses?"
    stuck: {then: "07"}
    listen:
      any: {then: "07"}
  "07":  # profile spotted silently, never said
    name: "Profile"
    note: 'Analyser / Procrastinator / Sceptic / Magpie'
    ui_stage: emotional
    listen:
      any: {then: "08"}
  "08":
    name: "Identity gap"
    note: 'they name gap: risk, decisions, responsibility, action'
    ui_stage: emotional
    say: "We love working with people going from 9-5er to business owner... exciting, but terrifying, because it's outside your comfort zone. What's the main difference between a successful business owner and an employee?"
    capture: gap
    listen:
      any:
        then: "09"
        ack: "What makes you successful as an employee doesn't make you successful in business."
  "09":
    name: "Limiting belief"
    note: 'the story they tell themselves: "not smart enough", "too late", "market is saturated"'
    ui_stage: emotional
    draft: true   # the play names the step; wording is not from the coach's source
    say: "When you're honest with yourself, what do you believe about yourself that's held you back?"
    capture: belief
    listen:
      any: {then: "belief_origin"}
  "belief_origin":
    name: "Where the belief came from"
    note: 'they see it is learned, not fact'
    ui_stage: emotional
    draft: true
    say: "Where do you think that belief comes from?"
    capture: belief_from   # an open question: a shrug is asked again, not moved past
    listen:
      any: {then: "belief_cost"}
  "belief_cost":
    name: "Cost of the belief"
    note: 'personal consequence of keeping it'
    ui_stage: emotional
    draft: true
    say: "If you keep believing that, what does it cost you over the next few years?"
    capture: belief_cost
    listen:
      any: {then: "10"}
  "10":
    name: "Consequence"
    note: 'they paint bad future themselves'
    ui_stage: emotional
    say: "What happens to people who say they want freedom but don't push past the fear?"
    capture: future
    listen:
      any:
        then: "willing"
        ack: "You could settle like everyone else. You already have for {years_said}."   # "1 year", "2 years": their number with the right unit
  "willing":
    name: "Willingness"
    ui_stage: emotional
    say: "Are you willing to keep settling for being average? Nothing wrong with that, I'm not here to judge"
    listen:
      any: {then: "11"}
  "11":
    name: "Why not?"
    ui_stage: emotional
    say: "What makes you so different from everyone else?"
    capture: different   # an open question: a shrug is asked again, not moved past
    listen:
      any:
        then: "12"
        ack: "No one's potential is determined by what they say but what they choose to do."
  "12":
    name: "Commit"
    ui_stage: emotional
    say: "What are you going to do differently from today to step into the shoes of a business owner who builds their own freedom?"
    capture: commitment
    listen:
      any: {then: "13"}
  "13":
    name: "Bridge"
    ui_stage: pitch
    say: "We can give you the tools and directions, but you're the one who needs to drive with full gas on the pedal, aren't you?"
    listen:
      any: {then: "14"}
  "14":
    name: "Investment"
    note: 'pre-handle sticker shock → refocus on transformation for future self + people they care about'
    ui_stage: pitch
    say: "{months}-month process, investment is {price}. There are ways to make the investment work as long as you're willing to make it work."
    listen:
      any: {then: "15"}
  "15":
    name: "Pillar 01 Education & curriculum"
    note: 'structured, step by step. No wasted time piecing together'
    ui_stage: pitch
    draft: true
    say: "{pillar_1}: structured, step by step, so there's no wasted time piecing it together."
    listen:
      any: {then: "16"}
  "16":
    name: "Pillar 02 Mentorship"
    note: 'direct coaching, tailored feedback, avoid landmines'
    ui_stage: pitch
    draft: true
    say: "{pillar_2}: direct coaching and tailored feedback to avoid the landmines. If you've been stuck and unsure, we put that frustration to bed."
    listen:
      any: {then: "17"}
  "17":
    name: "Pillar 03 Accountability"
    ui_stage: pitch
    draft: true
    say: "{pillar_3}: we tell you what you NEED to hear... hold your feet to the fire. Open to being called out?"
    listen:
      any: {then: "18"}
  "18":
    name: "Temp check"
    note: 'need clear yes. Confused buyer = "I need to think about it". Unclear → simplify, re-check'
    ui_stage: pitch
    draft: true  # probe is ours: the source says "unclear -> simplify, re-check"
    say: "That's everything in a nutshell. Does that make sense?"
    probe: "Put simply: a step-by-step plan, someone in your corner, and someone holding you to it. Does that make sense?"
    stuck: {then: "19"}   # still unclear after the simpler version: go to the close, objections handle doubt there
    listen:
      agrees:
        examples:
          - "yes"
          - "yeah, sure"
          - "fine, yes let's do it"
          - "sounds good to me"
          - "yes that makes sense"
          - "yeah it all makes sense"
          - "yes, clear"
          - "got it, makes sense"
          - "yeah, I am following you"
          - "yeah makes sense"
        then: "19"
      unclear:
        examples:
          - "no, that doesn't make sense"
          - "not really, I'm confused"
          - "kind of"
          - "sort of, I think"
          - "mostly, I guess"
          - "I'm not sure I follow"
          - "can you explain that again"
          - "I didn't understand that"
          - "I'm lost"
        then: "18"
  "19":
    name: "Soft close"
    note: 'objection → match profile → reuse its pattern break → re-ask soft close'
    ui_stage: pitch
    draft: true  # probe is ours: no source line for a second ask
    say: "Do you see yourself jumping in?"
    probe: "Where are you at with it right now?"
    stuck: {then: "m_identify"}   # still hesitant: find what holds them back (the objection matrix)
    listen:
      agrees:
        examples:
          - "yes I'm ready to jump in"
          - "yes let's do it"
          - "I'm in, I can see myself doing this"
          - "yes I see myself taking the jump"
        then: "20"
      hesitant:
        examples:
          - "no, not really"
          - "I'm not sure I'm ready"
          - "I don't see myself doing this"
          - "not right now"
          - "I can't see that happening"
          - "maybe, I'm not sure yet"
        then: "19"
  "20":
    name: "Self-resell"
    note: 'they sell themselves, own words'
    ui_stage: outcome
    draft: true  # the back-out ack is ours: no source line for someone who changes their mind
    say: "What makes you say that?"
    capture: reason
    listen:
      backs_out: &backs_out   # live: "actually no, forget it" got "Welcome aboard"; back to the soft close
        examples:
          - "actually no, forget it"
          - "no, I changed my mind"
          - "I don't want to do this anymore"
          - "no, I'm not doing this"
          - "never mind, I'm out"
          - "wait, I'm not sure anymore"
          - "no thanks, I'll pass"
          - "no"
        then: "19"
        ack: "No pressure at all."
        keep: false   # "forget it" is not their reason: never said back or quoted later
      any: {then: "21"}
  "21":
    name: "Next steps"
    ui_stage: outcome
    draft: true
    run_on: true   # leads straight into the payment question
    say: "You're on your way to building what you've been aiming for."
    listen:
      any: {then: "22"}
  "22":
    name: "Payment"
    ui_stage: outcome
    draft: true  # probe and back-out are ours: the source only has the question
    say: "How would you like to process the investment? Credit or debit?"
    probe: "Which works better for you, credit or debit?"
    stuck: {then: "19"}   # still no way to pay after asking twice: back to the soft close, never "welcome aboard"
    listen:
      pays:   # only a way to pay ends the call: "no, forget it" must never get "Welcome aboard"
        examples:
          - "credit"
          - "debit"
          - "credit card"
          - "debit card please"
          - "card"
          - "I'll pay by debit card"
          - "let's do credit"
          - "visa"
          - "paypal"
          - "bank transfer"
          - "either is fine"
          - "whichever is easier"
          - "yes, let's do it"
        then: "end"
      backs_out: *backs_out
  "end":
    name: "Welcome"
    ui_stage: outcome
    draft: true  # no source line for after payment
    say: "Perfect. I'll send everything over now. Welcome aboard."
  "later":
    name: "Follow-up"
    ui_stage: outcome
    draft: true  # the coach's FAQ says book the follow-up and leave on a good note; no wording
    say: "No problem. Let's book a follow-up call so you can decide properly, and I'll leave it there for today."
  "ready":   # `ready` above jumps here; after the soft close in order, so the price may be said
    name: "Ready buyer"
    note: 'they said they are in: make paying easy, no pitch'
    ui_stage: outcome
    draft: true  # coach's question; no source line for the lead-in
    say: "Love that. Are you aware of the programme from beforehand?"
    probe: "Do you already know what's in the programme?"
    stuck: {then: "ready_brief"}   # still unclear: give them the one-line version, it costs nothing
    listen:
      aware:
        examples:
          - "yes"
          - "yeah"
          - "yes I know about it"
          - "I've seen it already"
          - "I know what it is"
          - "yep, I've read all about it"
        then: "ready_price"
      unaware:
        examples:
          - "no"
          - "nope"
          - "not really"
          - "no, tell me about it"
          - "I don't know much about it"
        then: "ready_brief"
  "ready_brief":
    name: "Ready buyer: the programme in one line"
    ui_stage: outcome
    draft: true
    run_on: true
    say: "Quick version: it's a {months}-month programme with {pillar_1}, {pillar_2} and {pillar_3}."
    listen:
      any: {then: "ready_price"}
  "ready_price":
    name: "Ready buyer: price"
    ui_stage: outcome
    draft: true
    run_on: true   # straight into the payment question
    say: "The investment is {price}."
    listen:
      any: {then: "22"}
