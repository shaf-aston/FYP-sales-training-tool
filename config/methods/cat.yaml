# CAT call script, steps 00-22. Lines are the operator's script verbatim.
# {blank} = filled from the prospect's own answers (the script's XYZ) or from the offer.
# draft: true = a line on that step is not verbatim from the source and needs a trainer's wording.
first: "00"
price_step: "14"
steps:
  "00":
    ui_stage: logical
    draft: true
    run_on: true   # the frame leads straight into step 01's question
    say: "I believe you had a chat with {setter} setter... I've read your application but I don't like to assume anything"
    say_plain: "I've read your application but I don't like to assume anything."
    listen:
      any: {then: "01"}
  "01":
    ui_stage: logical
    say: "What do you want to specifically achieve by making money online?"
    capture: outcome
    probe: "What are you actually hoping to achieve?"
    listen:
      freedom:
        examples:
          - "I want financial freedom"
          - "I want to be free from my 9-5 and work from anywhere"
          - "I want time freedom so I can travel and choose my own schedule"
          - "I want to quit my job and be my own boss"
          - "freedom to do what I want with my days"
        then: "02"
  "02":
    ui_stage: logical
    draft: true
    say: "How much do you need to be making to feel {outcome} freedom?"
    say_plain: "How much do you need to be making to feel that freedom?"
    capture: number
    listen:
      any: {then: "03"}
  "03":
    ui_stage: logical
    say: "How long have you been thinking about this?"
    capture: years
    listen:
      any: {then: "04"}
  "04":
    ui_stage: emotional
    say: "If this has been on your mind for so many nights, months and years, why can't you just ignore it?"
    capture: why
    listen:
      any: {then: "05"}
  "05":
    ui_stage: emotional
    draft: true
    say: "What's the reason you haven't got to {outcome}?"
    say_plain: "What's the reason you haven't got there yet?"
    capture: blocker
    listen:
      any: {then: "06"}
  "06":
    ui_stage: emotional
    draft: true
    say: "What are you doing now to make {outcome} a reality and not just a dream?"
    say_plain: "What are you doing now to make that a reality and not just a dream?"
    capture: action
    listen:
      any: {then: "07"}
  "07":  # profile spotted silently, never said
    ui_stage: emotional
    listen:
      any: {then: "08"}
  "08":
    ui_stage: emotional
    say: "We love working with people going from 9-5er to business owner... exciting, but terrifying, because it's outside your comfort zone. What's the main difference between a successful business owner and a 9-5er like you?"
    capture: gap
    listen:
      any:
        then: "09"
        ack: "What makes you successful as an employee doesn't make you successful in business."
  "09":  # profile play (pattern break) is not wired in this slice
    ui_stage: emotional
    listen:
      any: {then: "10"}
  "10":
    ui_stage: emotional
    say: "What happens to people who say they want freedom but don't push past the fear?"
    capture: future
    listen:
      any:
        then: "willing"
        ack: "You could settle like everyone else. You already have for {years} years."
  "willing":
    ui_stage: emotional
    say: "Are you willing to keep settling for being average? Nothing wrong with that, I'm not here to judge"
    listen:
      any: {then: "11"}
  "11":
    ui_stage: emotional
    say: "What makes you so different from everyone else?"
    listen:
      any:
        then: "12"
        ack: "No one's potential is determined by what they say but what they choose to do."
  "12":
    ui_stage: emotional
    say: "What are you going to do differently from today to step into the shoes of a business owner who builds his own freedom?"
    capture: commitment
    listen:
      any: {then: "13"}
  "13":
    ui_stage: pitch
    say: "We can give you the tools and directions, but you're the one who needs to drive with full gas on the pedal, aren't you?"
    listen:
      any: {then: "14"}
  "14":
    ui_stage: pitch
    say: "{months}-month process, investment is {price}. There are ways to make the investment work as long as you're willing to make it work."
    listen:
      any: {then: "15"}
  "15":
    ui_stage: pitch
    draft: true
    say: "{pillar_1}: structured, step by step, so there's no wasted time piecing it together."
    listen:
      any: {then: "16"}
  "16":
    ui_stage: pitch
    draft: true
    say: "{pillar_2}: direct coaching and tailored feedback to avoid the landmines. You mentioned you've been stuck and unsure for years... we put that frustration to bed."
    listen:
      any: {then: "17"}
  "17":
    ui_stage: pitch
    draft: true
    say: "{pillar_3}: we tell you what you NEED to hear... hold your feet to the fire. Open to being called out?"
    listen:
      any: {then: "18"}
  "18":
    ui_stage: pitch
    draft: true  # no source probe: repeats the check
    say: "That's everything in a nutshell. Does that make sense?"
    listen:
      agrees:
        examples:
          - "yes that makes sense"
          - "yeah it all makes sense"
          - "yes, clear"
          - "got it, makes sense"
          - "yeah, I am following you"
        then: "19"
      unclear:
        examples:
          - "no, that doesn't make sense"
          - "not really, I'm confused"
          - "I'm not sure I follow"
          - "can you explain that again"
          - "I didn't understand that"
          - "I'm lost"
        then: "18"
  "19":
    ui_stage: pitch
    draft: true  # no source probe: repeats the close
    say: "Do you see yourself jumping in?"
    listen:
      agrees:
        examples:
          - "yes I'm ready to jump in"
          - "yes let's do it"
          - "I'm in, I can see myself doing this"
          - "yes I see myself taking the jump"
        then: "20"
      hesitant:
        examples:
          - "no, not really"
          - "I'm not sure I'm ready"
          - "I don't see myself doing this"
          - "not right now"
          - "I can't see that happening"
          - "maybe, I'm not sure yet"
        then: "19"
  "20":
    ui_stage: outcome
    say: "What makes you say that?"
    capture: reason
    listen:
      any: {then: "21"}
  "21":
    ui_stage: outcome
    draft: true
    say: "You're on your way to building the freedom you've been aiming for."
    listen:
      any: {then: "22"}
  "22":
    ui_stage: outcome
    say: "How would you like to process the investment? Credit or debit?"

# Said after the loop lines and the direct line have all been used. The trainer's FAQ says to
# book the follow-up and leave on a good note; it gives no wording.
follow_up:
  draft: true
  say: "No problem. Let's book a follow-up call so you can decide properly, and I'll leave it there for today."

# Objection loop (after the soft close). Loop twice, third time direct.
# Loop lines: the trainer's FAQ and the generic objection page.
objections:
  money:
    examples:
      - "it's too expensive"
      - "I can't afford that right now"
      - "that's more than I have"
      - "I don't have the money"
      - "I'm not sure I can cover the cost"
    loop:
      - "How much do you have now?"
      - "What can we do together to come up with the funds?"
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    draft: true
  partner:
    examples:
      - "I need to speak to my partner first"
      - "I have to talk to my wife about it"
      - "my husband would need to agree"
      - "I want to run it by my girlfriend"
      - "I need to check with my business partner"
    loop:
      - "Who makes the decisions at home?"
      - "When you picture that conversation with them, what do you think they would push back on most?"
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    draft: true
  fear:
    examples:
      - "I'm nervous it won't work for me"
      - "what if I fail"
      - "I'm worried about the risk"
      - "I've been burned before"
      - "I'm scared of making the wrong choice"
    loop:
      - "What's causing you to put time and space between you and the decision?"
      - "Is that the main thing, or is there something else behind it?"
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    draft: true
  think:
    examples:
      - "I need to think about it"
      - "let me do some more research first"
      - "I'll get back to you"
      - "now isn't the right time"
      - "can I sleep on it"
    loop:
      - "How long have you been researching? Two months turns into four, eight, sixteen."
      - "Is there a reason we can't do it as soon as possible? Spots are limited."
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    draft: true
  scam:
    examples:
      - "is this a scam"
      - "this sounds too good to be true"
      - "do you guarantee results"
      - "how do I know this is legit"
      - "there's so many rip-offs online"
    loop:
      - "You're right, there's a lot of shady things online."
      - "Do you want to find out or keep the door closed?"
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    draft: true
