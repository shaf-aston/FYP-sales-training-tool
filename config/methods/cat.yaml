# CAT call script, steps 00-22. Lines are the operator's script verbatim.
# {blank} = filled from the prospect's own answers (the script's XYZ) or from the offer.
# draft: true = a line on that step is not verbatim from the source and needs a trainer's wording.
first: "00"
price_step: "14"
revisit_step: "19"   # an objection parked before the price comes back when they hesitate at the soft close
# A keen buyer who says they're in before the pitch is asked one question, then shown how to pay
# (trainer: "just send the payment link, make it easy"). From the soft close on, the script closes itself.
ready:
  then: "ready"
  until: "19"
  min_score: 0.8   # long, specific examples: "I'm in sales" or "yes" must never jump
  examples:
    - "I'm in, send me the payment link"
    - "I'm ready to buy, how do I pay"
    - "I already know I want to join, how do I pay"
    - "where do I sign up, I want to join"
    - "how do I sign up"
    - "just send me the link to pay"
steps:
  "00":
    name: "Frame"
    ui_stage: intent
    draft: true
    run_on: true   # the frame leads straight into step 01's question
    say: "I believe you had a chat with {setter} setter... I've read your application but I don't like to assume anything"
    say_plain: "I've read your application but I don't like to assume anything."
    listen:
      any: {then: "01"}
  "01":
    name: "End outcome"
    note: 'FREEDOM. Vague → loop back, dig till freedom'
    ui_stage: intent
    draft: true  # probes 2-3 are ours: the source only says "dig till freedom"
    say: "What do you want to specifically achieve by making money online?"
    capture: outcome
    echo: true   # "financial freedom" goes back into the next lines as they said it
    probe:   # asked in turn; then `stuck` moves on instead of asking forever
      - "What are you actually hoping to achieve?"
      - "What would that money actually give you?"
      - "If money wasn't a problem, what would your days look like?"
    stuck: {then: "02"}
    listen:
      freedom:
        examples:
          - "I want financial freedom"
          - "I want to be free from my 9-5 and work from anywhere"
          - "I want time freedom so I can travel and choose my own schedule"
          - "I want to quit my job and be my own boss"
          - "freedom to do what I want with my days"
          - "I want more time with my kids and family"
          - "to spend more time with my family"
        then: "02"
      vague:   # restates the question or names no outcome: dig, never take it as freedom
        examples:
          - "I want to make money online"
          - "I just want to make money"
          - "make more money"
          - "I want to earn online"
          - "not sure really"
          - "I don't know"
        then: "01"
        keep: false   # "not sure really" is not their outcome: never said back to them
  "02":
    name: "Number"
    ui_stage: logical
    draft: true
    say: "How much would you need to be making each month {outcome|to achieve $|to $}?"
    say_plain: "How much would you need to be making each month to make that happen?"
    capture: number
    # "I want 5k a month" said earlier answers this step, so it is skipped. Needs a want/need word,
    # only "to make / be earning / around"-type words, then the figure and "a month": "I make 2k a month",
    # "a job paying 2k a month", "I need to save 200 a month" and "I don't want ..." are not the goal.
    answered_by: '(?<!n''t )(?<!not )\b(?:want|need|aim|aiming|hoping|looking|goal|target)(?:\s+(?:to|be|make|making|earn|earning|bring|bringing|in|about|around|at|least|like|roughly|for|of|is|maybe|ideally|say|minimum))*\s+(?P<answer>[$£€]?\d[\d,.]*\s*(?:k|grand|thousand)?\s*(?:a|per|each|every|/)\s*(?:month|mo)\b)'
    listen:
      any: {then: "03"}
  "03":
    name: "Time"
    ui_stage: logical
    say: "How long have you been thinking about this?"
    capture: years
    listen:
      failed_before:   # a past failed attempt is acknowledged before the script goes on
        examples:
          - "I tried dropshipping and it failed"
          - "I've tried a few things online and lost money"
          - "I started a business before but it didn't work out"
          - "I gave it a go and it flopped"
        then: "04"
        ack: "Sorry to hear that, plenty of people have a first attempt that doesn't work out."
      any: {then: "04"}
  "04":
    name: "Contextualise"
    note: 'emotional why. Let them talk'
    ui_stage: emotional
    say: "If this has been on your mind for so many nights, months and years, why can't you just ignore it?"
    capture: why
    listen:
      any: {then: "05"}
  "05":
    name: "Blocker"
    note: 'externalising: time, money, market, "still researching", "haven''t found the right thing"'
    ui_stage: emotional
    draft: true
    say: "What's the reason you haven't {outcome|got to $|managed to $}?"
    say_plain: "What's the reason you haven't got there yet?"
    capture: blocker
    doubts_answer: true   # money, time, fear are the answer here, not objections
    listen:
      any: {then: "06"}
  "06":
    name: "Challenge"
    note: 'little/no action = gap confirmed'
    ui_stage: emotional
    draft: true
    say: "What are you doing now {outcome|to make $ a reality and not just a dream|to $ rather than just dream about it}?"
    say_plain: "What are you doing now to make that a reality and not just a dream?"
    capture: action
    listen:
      any: {then: "07"}
  "07":  # profile spotted silently, never said
    name: "Profile"
    note: 'Analyser / Procrastinator / Sceptic / Magpie'
    ui_stage: emotional
    listen:
      any: {then: "08"}
  "08":
    name: "Identity gap"
    note: 'they name gap: risk, decisions, responsibility, action'
    ui_stage: emotional
    say: "We love working with people going from 9-5er to business owner... exciting, but terrifying, because it's outside your comfort zone. What's the main difference between a successful business owner and an employee?"
    capture: gap
    listen:
      any:
        then: "09"
        ack: "What makes you successful as an employee doesn't make you successful in business."
  "09":  # profile play (pattern break) is not wired in this slice
    name: "Break pattern"
    note: 'run their profile play'
    ui_stage: emotional
    listen:
      any: {then: "10"}
  "10":
    name: "Consequence"
    note: 'they paint bad future themselves'
    ui_stage: emotional
    say: "What happens to people who say they want freedom but don't push past the fear?"
    capture: future
    listen:
      any:
        then: "willing"
        ack: "You could settle like everyone else. You already have for {years} years."
  "willing":
    name: "Willingness"
    ui_stage: emotional
    say: "Are you willing to keep settling for being average? Nothing wrong with that, I'm not here to judge"
    listen:
      any: {then: "11"}
  "11":
    name: "Why not?"
    ui_stage: emotional
    say: "What makes you so different from everyone else?"
    listen:
      any:
        then: "12"
        ack: "No one's potential is determined by what they say but what they choose to do."
  "12":
    name: "Commit"
    ui_stage: emotional
    say: "What are you going to do differently from today to step into the shoes of a business owner who builds his own freedom?"
    capture: commitment
    listen:
      any: {then: "13"}
  "13":
    name: "Bridge"
    ui_stage: pitch
    say: "We can give you the tools and directions, but you're the one who needs to drive with full gas on the pedal, aren't you?"
    listen:
      any: {then: "14"}
  "14":
    name: "Investment"
    note: 'pre-handle sticker shock → refocus on transformation for future self + people they care about'
    ui_stage: pitch
    say: "{months}-month process, investment is {price}. There are ways to make the investment work as long as you're willing to make it work."
    listen:
      any: {then: "15"}
  "15":
    name: "Pillar 01 Education & curriculum"
    note: 'structured, step by step. No wasted time piecing together'
    ui_stage: pitch
    draft: true
    say: "{pillar_1}: structured, step by step, so there's no wasted time piecing it together."
    listen:
      any: {then: "16"}
  "16":
    name: "Pillar 02 Mentorship"
    note: 'direct coaching, tailored feedback, avoid landmines'
    ui_stage: pitch
    draft: true
    say: "{pillar_2}: direct coaching and tailored feedback to avoid the landmines. If you've been stuck and unsure, we put that frustration to bed."
    listen:
      any: {then: "17"}
  "17":
    name: "Pillar 03 Accountability"
    ui_stage: pitch
    draft: true
    say: "{pillar_3}: we tell you what you NEED to hear... hold your feet to the fire. Open to being called out?"
    listen:
      any: {then: "18"}
  "18":
    name: "Temp check"
    note: 'need clear yes. Confused buyer = "I need to think about it". Unclear → simplify, re-check'
    ui_stage: pitch
    draft: true  # probe is ours: the source says "unclear -> simplify, re-check"
    say: "That's everything in a nutshell. Does that make sense?"
    probe: "Put simply: a step-by-step plan, someone in your corner, and someone holding you to it. Does that make sense?"
    stuck: {then: "19"}   # still unclear after the simpler version: go to the close, objections handle doubt there
    listen:
      agrees:
        examples:
          - "yes"
          - "yeah, sure"
          - "fine, yes let's do it"
          - "sounds good to me"
          - "yes that makes sense"
          - "yeah it all makes sense"
          - "yes, clear"
          - "got it, makes sense"
          - "yeah, I am following you"
          - "yeah makes sense"
        then: "19"
      unclear:
        examples:
          - "no, that doesn't make sense"
          - "not really, I'm confused"
          - "kind of"
          - "sort of, I think"
          - "mostly, I guess"
          - "I'm not sure I follow"
          - "can you explain that again"
          - "I didn't understand that"
          - "I'm lost"
        then: "18"
  "19":
    name: "Soft close"
    note: 'objection → match profile → reuse its pattern break → re-ask soft close'
    ui_stage: pitch
    draft: true  # probe is ours: no source line for a second ask
    say: "Do you see yourself jumping in?"
    probe: "Where are you at with it right now?"
    stuck: {then: "later"}   # still hesitant: book the follow-up, don't keep pushing
    listen:
      agrees:
        examples:
          - "yes I'm ready to jump in"
          - "yes let's do it"
          - "I'm in, I can see myself doing this"
          - "yes I see myself taking the jump"
        then: "20"
      hesitant:
        examples:
          - "no, not really"
          - "I'm not sure I'm ready"
          - "I don't see myself doing this"
          - "not right now"
          - "I can't see that happening"
          - "maybe, I'm not sure yet"
        then: "19"
  "20":
    name: "Self-resell"
    note: 'they sell themselves, own words'
    ui_stage: outcome
    draft: true  # the back-out ack is ours: no source line for someone who changes their mind
    say: "What makes you say that?"
    capture: reason
    listen:
      backs_out: &backs_out   # live: "actually no, forget it" got "Welcome aboard"; back to the soft close
        examples:
          - "actually no, forget it"
          - "no, I changed my mind"
          - "I don't want to do this anymore"
          - "no, I'm not doing this"
          - "never mind, I'm out"
          - "wait, I'm not sure anymore"
          - "no thanks, I'll pass"
          - "no"
        then: "19"
        ack: "No pressure at all."
        keep: false   # "forget it" is not their reason: never said back or quoted later
      any: {then: "21"}
  "21":
    name: "Next steps"
    ui_stage: outcome
    draft: true
    run_on: true   # leads straight into the payment question
    say: "You're on your way to building what you've been aiming for."
    listen:
      any: {then: "22"}
  "22":
    name: "Payment"
    ui_stage: outcome
    draft: true  # probe and back-out are ours: the source only has the question
    say: "How would you like to process the investment? Credit or debit?"
    probe: "Which works better for you, credit or debit?"
    stuck: {then: "19"}   # still no way to pay after asking twice: back to the soft close, never "welcome aboard"
    listen:
      pays:   # only a way to pay ends the call: "no, forget it" must never get "Welcome aboard"
        examples:
          - "credit"
          - "debit"
          - "credit card"
          - "debit card please"
          - "card"
          - "I'll pay by debit card"
          - "let's do credit"
          - "visa"
          - "paypal"
          - "bank transfer"
          - "either is fine"
          - "whichever is easier"
          - "yes, let's do it"
        then: "end"
      backs_out: *backs_out
  "end":
    name: "Welcome"
    ui_stage: outcome
    draft: true  # no source line for after payment
    say: "Perfect. I'll send everything over now. Welcome aboard."
  "later":
    name: "Follow-up"
    ui_stage: outcome
    draft: true  # the follow_up line below, as an ending step `stuck` can lead to
    say: &follow_up "No problem. Let's book a follow-up call so you can decide properly, and I'll leave it there for today."
  "ready":   # `ready` above jumps here; after the soft close in order, so the price may be said
    name: "Ready buyer"
    note: 'they said they are in: make paying easy, no pitch'
    ui_stage: outcome
    draft: true  # trainer's question; no source line for the lead-in
    say: "Love that. Are you aware of the programme from beforehand?"
    probe: "Do you already know what's in the programme?"
    stuck: {then: "ready_brief"}   # still unclear: give them the one-line version, it costs nothing
    listen:
      aware:
        examples:
          - "yes"
          - "yeah"
          - "yes I know about it"
          - "I've seen it already"
          - "I know what it is"
          - "yep, I've read all about it"
        then: "ready_price"
      unaware:
        examples:
          - "no"
          - "nope"
          - "not really"
          - "no, tell me about it"
          - "I don't know much about it"
        then: "ready_brief"
  "ready_brief":
    name: "Ready buyer: the programme in one line"
    ui_stage: outcome
    draft: true
    run_on: true
    say: "Quick version: it's a {months}-month programme with {pillar_1}, {pillar_2} and {pillar_3}."
    listen:
      any: {then: "ready_price"}
  "ready_price":
    name: "Ready buyer: price"
    ui_stage: outcome
    draft: true
    run_on: true   # straight into the payment question
    say: "The investment is {price}."
    listen:
      any: {then: "22"}

# Said after the loop lines and the direct line have all been used. The trainer's FAQ says to
# book the follow-up and leave on a good note; it gives no wording.
follow_up:
  draft: true
  say: *follow_up

# Objection loop (after the soft close). Loop twice, third time direct.
# Loop lines: the trainer's FAQ and the generic objection page.
objections:
  money:
    examples:
      - "it's too expensive"
      - "I can't afford that right now"
      - "that's more than I have"
      - "I don't have the money"
      - "I'm not sure I can cover the cost"
    loop:
      - "How much do you have now?"
      - "What can we do together to come up with the funds?"
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    normalise: "Okay. There are ways to make the investment work as long as you're willing to make it work."
    early: "I haven't mentioned a price yet, so let's first see if this is even a fit."   # draft   # draft: the play says "normalise" with no wording
    draft: true
  partner:
    examples:
      - "I need to speak to my partner first"
      - "I have to talk to my wife about it"
      - "my husband would need to agree"
      - "I want to run it by my girlfriend"
      - "I need to check with my business partner"
    loop:
      - "Who makes the decisions at home?"
      - "When you picture that conversation with them, what do you think they would push back on most?"
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    normalise: "That makes sense, it's a big decision."   # draft: the play says "normalise" with no wording
    draft: true
  fear:
    examples:
      - "I'm nervous it won't work for me"
      - "what if I fail"
      - "I'm worried about the risk"
      - "I've been burned before"
      - "I'm scared of making the wrong choice"
    loop:
      - "What's causing you to put time and space between you and the decision?"
      - "Is that the main thing, or is there something else behind it?"
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    normalise: "That's completely normal. It's exciting, but terrifying, because it's outside your comfort zone."   # draft: the play says "normalise" with no wording
    draft: true
  think:   # Procrastinator: "I need to think about it" (buyer-profiles play)
    examples:
      - "I need to think about it"
      - "I'll get back to you"
      - "now isn't the right time"
      - "can I sleep on it"
      - "maybe later, not right now"
    loop:
      - "Have you heard of procrastination? What does it mean to you?"
      - "Is there a reason we can't do it as soon as possible? Spots are limited."
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    normalise: "Exactly, and that's completely normal. Most people we work with felt the same before they started."   # draft: the play says "normalise" with no wording
    draft: true
  research:   # Analyser: still researching, needs more info (buyer-profiles play)
    examples:
      - "let me do some more research first"
      - "I want to look at a few other options"
      - "I need more information before I decide"
      - "I'm still comparing programmes"
      - "I want to read some reviews first"
    loop:
      - "Have you heard of analysis paralysis? What does it mean to you?"
      - "How long have you been researching? Two months turns into four, eight, sixteen."
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    normalise: "That's normal. Most people who come to us have been stuck researching too."   # draft: the play says "normalise" with no wording
    draft: true
  scam:
    examples:
      - "is this a scam"
      - "this sounds too good to be true"
      - "do you guarantee results"
      - "how do I know this is legit"
      - "there's so many rip-offs online"
    loop:
      - "You're right, there's a lot of shady things online."
      - "Do you want to find out or keep the door closed?"
    direct: "Are you going to keep thinking about it, or are you going to make a change?"
    normalise: "Fair enough, it pays to be careful."
    early: "Fair question, there's a lot of shady stuff online. This call is to see if we can even help you first."   # draft   # draft: the play says "normalise" with no wording
    draft: true
