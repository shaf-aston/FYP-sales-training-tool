# Every tunable number in the app, the defaults for env-var settings, and the response headers.
# core/infra/constants.py is the only reader. All numbers must be > 0; the app refuses to start otherwise.

defaults:            # used when the matching env var is unset (.env overrides)
  allowed_origins: "https://eloquence-sales.vercel.app,http://localhost:5000"   # ALLOWED_ORIGINS
  llm_provider_order: [groq]                                                            # LLM_PROVIDER_ORDER
  # Groq retires models without notice (llama-3.3-70b-versatile now 404s, which silently emptied
  # every reply). Check `client.models.list()` against the live key when replies go blank;
  # override with GROQ_LLM_MODEL.
  groq_model: "qwen/qwen3.8-27b"                                                        # GROQ_LLM_MODEL
  # Models that think before answering by default, and the setting that stops it. Hidden thinking still
  # uses max_tokens, so a short call (a 30-token ack) came back empty. Only listed models get the setting.
  groq_reasoning_effort: {"qwen/qwen3.8-27b": "none"}
  trust_proxy_headers: false                                                            # TRUST_PROXY_HEADERS: believe X-Forwarded-For (only behind a proxy you control)
  logs_dir: "data/logs"                                                                # LOGS_DIR: events, timings and feedback land in <dir>/<stream>/<day>.jsonl
  log_level: "INFO"
  db_path: "data/eloquence.db"   # DB_PATH: accounts database (SQLite), relative to the project root                                                                     # how much reaches the server log (journalctl)

server:
  port: 5000            # `python backend/app.py`; gunicorn takes its own

sessions:
  seller_max: 200             # buy mode: live AI sellers (SellerBot)
  seller_idle_minutes: 60
  buyer_max: 100              # sell mode: live AI buyers (BuyerSession)
  buyer_idle_minutes: 30
  cleanup_interval_seconds: 900   # both modes

input:
  max_request_bytes: 1000000   # any request body; bigger gets 413 before it is read (a call transcript is the largest)
  max_message_length: 1000
  max_field_length: 5000
  max_chosen_objection_chars: 200   # learner-typed objection to practise
  max_persona_name_chars: 40
  max_custom_buyer_text_chars: 300  # a field of a buyer the learner describes (sell init custom_buyer)
  max_custom_buyer_items: 5         # needs, pain points and objections each
  max_feedback_comment_chars: 500   # longer feedback comments are cut
  max_feedback_page_chars: 50       # the page name sent with feedback
  max_turn_number: 1000             # largest turn number the sell routes accept
  session_id_min_chars: 8
  session_id_max_chars: 128

calls:               # an uploaded call transcript (core/calls)
  max_chars: 200000        # a two-hour call is about 120k characters
  min_turns: 4             # fewer turns than this is not a conversation to learn from
  min_speakers: 2
  max_speaker_chars: 40    # a label longer than this is a sentence with a colon, not a speaker
  max_speaker_words: 5     # "Norio Kobota" fits; "The plan for next quarter" does not
  max_header_chars: 80     # only lines (or line starts) this short are tried as speaker labels
  max_quote_chars: 180     # a quote kept from the call (objection, need, pain) is cut to this
  max_list_items: 3        # needs and pain points kept per profile
  max_objections: 4        # objections kept per profile...
  per_type: 2              # ...and at most this many of one type

accounts:
  min_password_chars: 8
  max_email_chars: 254
  max_account_name_chars: 60
  max_team_name_chars: 60
  max_skill_entries: 200     # per learner, newest kept
  max_saved_prospects: 50    # per learner
  scrypt: {n: 16384, r: 8, p: 1}   # password hashing cost; raising it only affects new hashes
  session_days: 30           # how long a login lasts

rate_limits:         # [max_requests, window_seconds] per client IP; bucket names are used in the routes
  buy_init: [10, 60]   # buy mode: starting a session
  buy_chat: [60, 60]   # buy mode: chat, edit and coach
  sell: [30, 60]       # sell mode: every rate-limited sell route
  calls: [20, 60]      # reading an uploaded call transcript (each read parses up to calls.max_chars)
  account: [10, 60]    # sign up, log in, teams (slows password guessing; each check costs ~50 ms of scrypt)
  knowledge: [10, 60]  # both modes: custom product knowledge
  feedback: [5, 300]   # both modes: feedback form
  speech: [40, 60]     # both modes: replies read aloud

provider:            # every request to an LLM provider
  timeout_seconds: 20   # a stalled request gives up after this
  attempts: 1           # tries per key; more lets the SDK retry rate limits, which burns quota

llm:                 # one profile per kind of call; pass as **LLM["name"]
  default:        {temperature: 0.4, max_tokens: 150}   # low = steady wording; replies run 12-80 tokens
  buyer_reply:    {temperature: 0.6, max_tokens: 150}   # a little variety so personas differ
  quiz:           {temperature: 0.3, max_tokens: 300}
  coach_answer:   {temperature: 0.4, max_tokens: 150}

coach:
  history_turns: 8        # latest turns of the call the coach is shown

buyer:
  sold_readiness: 0.85    # this keen, this many turns in, says yes
  sold_min_turns: 3
  walk_min_turns: 3       # never walks before this; one weak opener is not a lost sale
  walk_readiness: 0.4     # still this cold when patience runs out, walks

grades:
  thresholds: [60, 70, 80, 90]
  labels: [F, D, C, B, A]

security:
  headers:             # on every response
    X-Frame-Options: "DENY"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"
    X-XSS-Protection: "1; mode=block"
    Cross-Origin-Opener-Policy: "same-origin"
    Cross-Origin-Resource-Policy: "same-origin"
    Permissions-Policy: "camera=(), microphone=(self), geolocation=()"
  api_headers:         # on /api/* responses only: answers are per-learner, never cached
    Cache-Control: "no-store, max-age=0"
    Pragma: "no-cache"
  csp:                 # Content-Security-Policy: directive -> allowed sources
    default-src: ["'self'"]
    script-src: ["'self'", "'unsafe-inline'", "https://cdn.jsdelivr.net", "https://js.puter.com"]
    style-src: ["'self'", "'unsafe-inline'"]
    img-src: ["'self'", "data:", "blob:"]
    media-src: ["'self'", "data:", "blob:", "https://puter.com", "https://*.puter.com"]
    connect-src: ["'self'", "https://js.puter.com", "https://puter.com", "https://*.puter.com"]
    font-src: ["'self'", "data:"]
    frame-ancestors: ["'none'"]
    base-uri: ["'self'"]
    form-action: ["'self'"]

speech:              # replies read aloud by the server, so the browser needs no sign-in. Change model/voice here.
  model: canopylabs/orpheus-v1-english   # Groq text-to-speech; accept its terms once in the Groq console
  voice: daniel
  format: wav
  max_chars: 200     # the model's limit per request; longer replies go in sentence-sized pieces, joined into one audio file
  style: ""          # optional voice direction said before each piece, e.g. "[cheerful]" (counts toward max_chars)
