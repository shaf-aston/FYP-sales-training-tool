# Jumping to a stage (buy mode, the stage bar): where each stage starts, and the answers the learner is
# taken to have given on the stages skipped. The learner sees these on a recap card and can edit them first,
# so the seller's first line has real answers to build on ("You said leads dried up...").
# starts: stage -> the step on the main path the jump lands on (never an objection branch).
# samples: slot (a step's `capture`) -> a plausible answer, in the prospect's words.
lead: "Picking up where we left off."   # said in front of the first line after a jump past the opening
cat:
  starts: {intent: "00", logical: "02", emotional: "04", pitch: "13", outcome: "21"}
  samples:
    outcome: "financial freedom"
    practical: "pay off my debts and stop stressing about bills"
    identity: "someone my family can rely on"
    number: "5k a month"
    years: "about two years"
    why: "it keeps me up at night"
    blocker: "I don't know where to start"
    action: "watching YouTube videos"
    gap: "I freeze when it's my call to make"
    gap_how: "they decide and back themselves"
    belief: "that I'm not good enough"
    belief_from: "my dad always said I'd never stick at anything"
    belief_cost: "another few years stuck in the same job"
    future: "they stay exactly where they are"
    different: "I follow through once I commit"
    commitment: "stop overthinking and take action"
    reason: "I'm sick of waiting for the right time"
impact_formula:
  starts: {intent: intent, logical: problem, emotional: why_now, pitch: commit, outcome: payment}
  samples:
    goal: "getting more clients"
    problem: "finding leads consistently"
    duration: "about six months"
    change: "have a steady flow of leads"
    impact: "yes, I can't grow without them"
    why_now: "I've just lost my biggest client"
    future: "I'd finally hit my monthly target"
    cost: "I'd have to go back to a 9-5"
    reason: "I'm tired of guessing"
