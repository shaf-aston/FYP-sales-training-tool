# Small interruptions answered in one line, then the script resumes.
# All replies are drafts: the source scripts have no wording for these.
# draft is an authoring marker only: the app ignores it.
# after: what follows the reply (default ask = the step's question again, in the words last used)
#   wait = say the reply and wait for them; the question comes back when they return.
#   rephrase = ask the step in other words (its next probe) instead of the same line.
#   rephrase_else_move_on = rephrase a step that has other words; otherwise go on to the next step
#     without taking the reply as its answer.
# min_score: a match must score at least this on every step (for words that are often real answers too).
park: "That's fair, and we'll come back to it once we know this is even a fit."   # objection before the price: acknowledge, keep going
revisit: "Coming back to what you raised earlier."   # a parked objection, raised again when they hesitate at the close
# A nudge to carry on ("what's next?", "go on"). Live: "yeah makes sense, what's next?" got "I don't know
# that one offhand". Cut off the end of a reply, the rest is heard as usual ("credit, what's next?" pays).
# A reply that is only a nudge: the reply below, then the step in other words, or the next step.
# A reply that gives nothing to an open question: asked again in other words, never saved as their
# answer, never moved on from before the step's `misses` (engine.yaml). Live: "dunno man", "stuff i guess"
# were taken as answers and the call walked on. "whatever" and "meh" belong to `frustrated` below. Matched by meaning on steps that take any
# reply; steps with their own labels ("vague", "unclear", "hesitant") hear these themselves.
# min_score measured on the real model: these score 0.86+, real short answers ("nothing yet",
# "maybe travel", "idk maybe 5k", "I don't know if I can afford it") 0.82 or less. Never add "nothing"
# or "no": "nothing yet" answers "what are you doing now".
unclear:
  min_score: 0.86
  examples: ["I don't know", "not sure", "no idea", "dunno", "idk", "stuff I guess", "things",
             "I haven't thought about it", "hard to say", "it depends", "not sure what to say",
             "I can't think of anything", "beats me", "no clue", "maybe", "eh", "good question",
             "let me think", "who knows", "anything", "I guess", "umm"]
# Their reply had words but not the answer ("stuff", "make more money"): ask what they meant by them.
ask_meaning: "What do you mean by {said|$|wanting to $}?"   # draft: the owner's ask, our wording
nudge:
  draft: true
  reply: "Sure."
  phrases: ["what's next", "what next", "whats next", "what now", "and then what", "then what", "and then", "go on", "keep going", "what else", "ok and", "and"]
interruptions:
  pause:
    draft: true
    after: wait
    examples:
      - "hold on a second"
      - "sorry, give me a moment"
      - "one sec, someone's at the door"
      - "sorry, my kid is yelling"
      - "hang on, my kids need me"
      - "sorry, the dog is going mad"
      - "can you give me two minutes"
      - "brb"
    reply: "No problem, take your time."
  back:
    draft: true
    after_wait: true
    examples:
      - "ok I'm back"
      - "sorry about that, I'm back"
      - "right, where were we"
      - "ok sorted, carry on"
    reply: "No worries."
  repeat:
    draft: true
    examples:
      - "sorry, can you say that again"
      - "I didn't catch that"
      - "what was the question"
      - "can you hear me?"
      - "you're breaking up"
      - "sorry, the line is bad"
    reply: "Of course, let me ask that again."
  thanks:
    draft: true
    examples:
      - "thanks for your time"
      - "thank you, that's helpful"
    reply: "You're welcome."
  bot:
    draft: true
    examples:
      - "is this a bot?"
      - "am I talking to a real person"
      - "are you an AI"
      - "is this automated"
      - "are you a robot"
    reply: "Yes, I'm an AI playing the salesperson so you can practise."   # never deny being an AI
  clarify:
    draft: true
    after: rephrase
    examples:
      - "what do you mean"
      - "what do you mean by that"
      - "not sure what you mean"
      - "I don't understand the question"
      - "I don't get what you're asking"
      - "can you explain that"
      - "why do you keep asking the same thing"
      - "I already answered that"
      - "I just told you"
      - "you asked me that already"
    reply: "Fair point, let me put it another way."
  frustrated:   # live: "stop with the script man", "whatever", "this is stupid" got the same line again
    draft: true
    after: rephrase_else_move_on
    min_score: 0.75   # "whatever works for me" and "I don't care about money" are answers, not anger
    examples:
      - "stop with the script man"
      - "this is stupid"
      - "stop asking me so many questions"
      - "enough with the questions"
      - "why are you interrogating me"
      - "just get to the point"
      - "this is a waste of my time"
      - "meh, whatever"   # not bare "whatever": it pulls in "whatever works for me"
      - "ugh whatever man"
      - "f*** off with the questions"
    reply: "Fair enough, I'll keep this quick."
