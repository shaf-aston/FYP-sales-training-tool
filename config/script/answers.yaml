# Answers that mean the same wherever they are asked for. A step's route takes one with `like: <name>`,
# plus any examples of its own (`examples:`). One list per meaning: a fix here reaches every step that
# hears it (live: "credit" was a yes at one "Do you see yourself jumping in?" and not at the other).
"yes": ["yes", "yeah it would", "definitely", "probably yes", "yeah I would"]
"no": ["no", "not really", "probably not", "definitely not"]
jump_in:   # a yes to "Do you see yourself jumping in?"
  - "yes"
  - "yes let's do it"
  - "I'm in"
  - "yes I'm ready to jump in"
  - "I'm in, I can see myself doing this"
  - "yes I see myself taking the jump"
  - "ok, let's go"   # draft
  - "I don't see why not"   # draft: whole calls, it was heard as not yet
pay_now:   # a yes that is already about paying: the payment question next, not "What makes you say that?"
  - "how do I pay"   # draft
  - "credit"   # draft
  - "debit"   # draft
  - "I'll pay by card"   # draft
  - "send me the payment link"   # draft
not_yet:   # a no to "Do you see yourself jumping in?"
  - "no"
  - "not yet"
  - "I'm not sure"
  - "no, not really"
  - "I'm not sure I'm ready"
  - "I don't see myself doing this"
  - "not right now"
  - "I can't see that happening"
  - "maybe, I'm not sure yet"
backs_out:   # changing their mind after a yes (live: "actually no, forget it" got "Welcome aboard")
  - "actually no, forget it"
  - "no, I changed my mind"
  - "I don't want to do this anymore"
  - "no, I'm not doing this"
  - "never mind, I'm out"
  - "wait, I'm not sure anymore"
  - "no thanks, I'll pass"
  - "actually I don't think so"   # draft
  - "no"
  - "I'm not interested"   # draft: whole calls, "I'm just not interested" at 20 went to payment
