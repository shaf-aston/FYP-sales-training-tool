# Script engine knobs. The engine reads these; it never hardcodes them.
method: cat            # default method (config/methods/<name>.yaml); a product may name its own
# Which practice products the script sells: the offer (config/offers/<name>.yaml) and, optionally, the method for each.
# A session asking for a product not listed here gets default_product.
products:
  high_ticket_sales_mentorship: {offer: shay_coaching, method: cat}
default_product: high_ticket_sales_mentorship   # used when a session names no listed product (the web UI never picks one)
embed_model: BAAI/bge-small-en-v1.5
embed_cache_dir: .cache/fastembed   # model files; relative to the project root, gitignored
embed_threads: 1       # CPU threads for the model; more threads use much more memory (free hosts have 512 MB)
embed_batch_size: 16   # texts embedded at once; smaller keeps peak memory low
threshold: 0.65        # lowest similarity that counts as a match
early_objection_min_score: 0.85   # before the price, a stated objection must match this well: "money", "scared", "risk" (about 0.7-0.81) are answers; "I can't afford it" (0.9+) is an objection
early_objection_judge_score: 0.78   # between this and the line above, the AI judges objection or answer ("10k seems like a lot" 0.81); AI down = answer
interrupt_threshold: 0.8   # on a step that takes any answer, an interruption must score this high
question_answer_min_score: 0.8   # a question is one of the step's answers only this sure: "can we do option 2?" (0.9) chooses, "what happens to the card?" (0.74) asks
near_miss: 0.1         # a top score this far under the threshold is a close call too
margin: 0.03           # top two labels closer than this = close call
close_call_k: 3        # candidates handed to the judge on a close call
unsure_margin: 0.12    # draft: a reply this much nearer not knowing (common_sense `unclear`) than its best answer is none: "maybe" (1.0 vs "yes" 0.87), not "I think so" (0.87 vs 0.87)
clause_breaks: [",", ";", ".", "!", "?", "and", "but", "so"]   # a long reply is also heard part by part, split at these: "to travel and work from bali and never have a boss" reads as its parts
break_not_before: [much, many, far, "so that", "and a half"]   # draft: round 74 callers, "thanks so much" was cut into "thanks" and "much", and "much" kept as the answer: "so" before these is not a break; draft (so that): round 76 callers, "so that i can quit" was saved as "that i can quit"; a pair keeps only its own break   # draft (and a half): round 92 callers, "probably about a year and a half" was cut at "and" and said back as 12 months
ask_tails: [why, "how come", "why do you ask", "why do you want to know"]   # draft: round 77 callers, a "why?" on the end with no comma ("yes why?", "money why?") got "I don't know that one offhand", while "yes, why?" was heard as yes and why: such a tail, only last and with its "?", is a part of its own
ask_tails_not_after: [know, sure, idea, clue, dunno, idk, wonder, "that's", thats]   # draft: round 78 mutation, "I don't know why?" was cut like "yes why?" and got "It helps me see"; after these the tail is what they don't know
clause_min_words: 3     # a part shorter than this is too little to hear on its own
max_words: 30          # longest sentence the AI may write
ai_retries: 1
ai_rest_seconds: 60    # after ai_fail_limit failures in a row, skip the AI this long (plain script lines meanwhile)
ai_fail_limit: 3       # failures in a row (any user) before the AI rests; one slow call must not silence it for everyone
ai_timeout_seconds: 2   # a slow AI call is abandoned; the turn uses the script line
ai_workers: 4          # AI calls in flight at once; an abandoned slow call keeps its worker until it ends
objection_entries: 2   # objections that get their matrix branch in one call; the next books the follow-up
slot_words: 6          # longest phrase echoed into a script blank
rise_answer_words: 6   # a part this short that ends in "?" but isn't phrased as a question, and has the step's `needs` ("dunno, a year?"), is the answer said with a rise
rise_unsure_words: 2   # draft: round 78 callers, "not sure?" got "let me say that again": a part of this many words or more, near not knowing, said with a "?" is not knowing; one word ("eh?", "hmm?") still asks for the line again
reason_starts: [because, cause, cos, coz, cuz, bc]   # draft: a reply opening like this is a reason: said with a rise ("because money is nice?") it is never a question, and before the price it is never an objection (whole calls: "because my kid just started school and money is tight" got "I haven't mentioned a price yet")
reason_backs: ["yes", yeah, yep, yup, yea, yeh, ya, okay, sure, alright, definitely, absolutely, certainly]   # draft: round 52 callers, "yes because I need the money" was heard as a money worry and "yeah because my wife wants it" as a partner one: a reason after these (or a short_replies form of one: "k", "ofc", "why not") only says why yes, so it raises no worry; "no because I can't afford it" still does
echo_term_words: 3     # outside a step marked `moment`, their words come back only as a term this short (echo.py)
echo_repeats: 2        # the same phrase of theirs is said back at most this many times a call
takes_back: ["no", not_yet, backs_out]   # shared answers (answers.yaml) that say no: "no, credit?" is torn, not paying (verdict `_takes_back`)
lead_repeats: 2        # a lead line ("No rush, even a rough idea helps.", "Fair enough, I'll keep this quick.") is said at most this many times a call, then left out
stop_words: [a, an, the, i, i'm, i've, my, me, to, of, and, or, in, "on", at, for, is, am, are, be, it, that, this, so, with, as, by, we, you, your, we're, we've, it's, that's, you're]   # draft (we're to you're): round 46 callers, "we're fine" to "Credit or debit?" got "Welcome aboard" ("i'm fine" was a shrug)
side_words: [in, "on", for, with]   # draft: round 46 callers, "I'm in" to "Do you see yourself jumping in?" was only stop words, so a shrug; with these ("I'm on it", "I'm with you") it says where they stand
filler_words: [ok, okay, sure, yeah, yep, "yes", hmm, mm, cool, alright, right, k, kk, idk, dunno, fr, frfr, lol, lmao, fine, ye, yeh, yea, yh, ya, mhm, mmm, certainly, absolutely, definitely, indeed, totally, jk, then, oh, ah, please, acha, okey, dokey, okie, dokie, exactly, precisely, hi, hey, damn, well, actually, omg, wow, yay, oof, jeez, argh, yup, ngl, imo]   # a reply made only of these (and stop_words) says nothing ("fine, but is this a scam?" answers nothing); never add "no", it answers yes/no steps; draft (ye to totally, jk): whole calls, "jk, more money" was said back as "jk more money";, "ye" and "Certainly." to an open question were saved as the answer; draft (then): round 44 callers, "alright then" and "ok then" to an open question were saved as the answer; draft (oh, ah, please, acha): round 47 callers, "oh sure", "please go on" and "acha ok" (Urdu and Hindi "ok") were saved as the answer at every step; draft (okey to dokie): round 48 callers, "okey-dokey" was saved as their reason; draft (exactly, precisely): round 49 callers, "exactly" was saved as their reason and "precisely more money" was said back; draft (hi, hey): round 51 callers, "hi, money" was said back as "with hi, money?"; draft (damn): round 53 callers, "ok damn" was saved as the answer at every open step; draft (well to argh): round 54 callers, "well ok", "actually ok" and "omg ok" to an open question were saved as the answer, and "actually money" was said back as "with actually money?"; draft (yup, ngl, imo): round 56 callers, "yup", "yuppp" and "ngl ok" to an open question were saved as the answer
no_answer_words: [hmm, hm, mm, idk, dunno, lol, lmao, lmfao, haha, hahaha, rofl, sorry, rn, asap]   # draft: a reply made only of these (and stop_words) answers no yes-or-no question either ("lol" to "do you want that to dictate your results?" was heard as "no"); draft (sorry): whole calls, "sorry" alone to "Does that make sense?" was a pause, again and again; draft (rn, asap): round 52 callers, "ok rn" was saved as the answer and "more money rn" was said back whole; draft (hm): round 82, "hm?" was saved as the answer
shrug_phrases: ["who knows", clueless, "hard to say", "beats me", "good question", "great question", "good one", "we'll see", "it is what it is", "your guess is as good as mine", "not sure what to say", "i haven't thought about it", "i can't think of anything", "fingers crossed", "touch wood", "knock on wood", "god willing", "up to you", "you tell me", "your call", "i don't mind", "i'm easy", "no idea", "no clue", "not a clue", "search me", "tough one", "that's a tough one", "that's a hard one", "hard one", "tricky one", "that's a tricky one", "i don't know", "don't know", "let me think", "don't know why", "not sure why", "no idea why", "no clue why", "dunno why", "idk why", "don't know how", "dunno how", "i don't know why", "i don't know how", unsure, uncertain, "idk how", "no idea how", "not sure how", "who am i to say", "nae idea", "nae clue", "dinnae ken", "dinnae know", "bad signal", "poor signal", "bad connection", "sorry bad signal", "no idea at all", "no clue at all", "dunno at all", "idk at all", "idk either", "dunno either", "no idea either", "not sure either", "idk now", "dunno now", "idk too", "dunno too", "no sé", "no se", "no lo sé", "no lo se"]   # draft (unsure, uncertain): round 79 callers, "unsure" got "What do you mean by unsure?" and "I am uncertain" was saved as the reason; draft (don't know why to dunno how): round 78 mutation, "I don't know why" got "What do you mean by why?" and "not sure why" was saved as the reason   # draft (i don't mind, i'm easy): round 66 callers, "I'm easy" was saved as the answer at every open step, and "I don't mind" as the reason at 05; draft (fingers crossed to your call): round 65 callers, "fingers crossed" and "you tell me" were saved as the answer, and "up to you" at 05 was heard as leaving; draft: round 64 callers, these say nothing and have no words to ask about: "who knows" got "What do you mean by who knows?"; draft (no idea to search me): round 71 mutation, "no idea?" got "I don't know that one offhand, I'll find out and let you know"; draft (tough one to let me think): round 74 callers, "that's a tough one, money" was saved whole and "that's a tough one" alone as the answer; "don't know" to "Is there anything you've tried so far?" was saved as what they do; draft (great question, good one): round 82 callers, "great question" got "What do you mean by great question?" and "ooh good one, free" was saved whole; draft (clueless): round 83 callers, "clueless?" got "I'll find out" and "clueless" was saved as the answer ("no clue" said nothing); draft (idk how to who am i to say): round 84 callers, "idk how" was saved as the blocker ("dunno how" said nothing) and "who am I to say" got "I'm an AI"; draft (nae idea to sorry bad signal): round 85 callers, "nae idea" and "dinnae ken" (Scots) and "sorry bad signal" alone were saved as the answer; draft ("no idea at all" to "dunno too"): round 86 mutation, these were saved as "at all", "now" or "too"   # draft (no sé to no lo se): round 92 callers, "no sé" (Spanish "I don't know") was saved as the answer at every step
no_words: ["no", nah, nope, naw, nay]   # draft: a reply made only of these (and stop_words) is a plain no, an answer, never an interruption (whole calls: "nah" was heard as "what do you mean?")
no_polite_words: [thanks, thank, thx, ty, cheers]   # draft: round 34 callers, "no thank you" to every open question was kept as the answer; with these a no is still a plain no to a yes-or-no question ("Open to being called out?" "no thanks"), to an open one it is `not_interested` (common_sense.yaml)
thanks_ends: [thanks, "thank you", cheers, ta, "thanks a lot", "thanks so much", "thank you so much", "thank you very much", "thanks mate", "cheers mate", "thanks a bunch", "many thanks", "thanks for asking", "thank you for asking", "cheers for asking", "thanks very much", "thanks a million", "ta very much"]   # draft (thanks for asking to ta very much): round 86 callers, "cheers mate, 2k" was saved as "mate, 2k, cheers" and "ta very much, 2k" whole: a thank-you before the answer goes last whole; draft: round 82 callers, "2k thanks" was saved whole: a thank-you on the end is its own part ("2k, thanks"), so the answer is kept and the thanks heard; "ok thanks" and "no thanks" stay whole
sense_over_after: [wait, follow_up]   # draft: round 33 callers, "sorry was driving, 2k" ended the call and "sorry kids were shouting, 2k" got "take your time": a pause or goodbye said in the past is over, so it is talk
sense_over_words: [was, were, had]   # draft: the words that put a pause or goodbye in the past
