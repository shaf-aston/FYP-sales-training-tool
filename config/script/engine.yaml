oney" and "ideally money" were said back with the lead; draft (obviously to pretty much): round 60 callers, "obviously money", "really money", "lowkey 2k" and "pretty much quit" were saved with their lead, and "seriously money" was said back; draft (essentially to mmm): round 61 callers, "essentially money", "usually quit" and "mhm 2k" were saved with their lead; draft (frankly, bruh): round 62 callers, "frankly money" was said back as "with frankly money?", and "frankly no" and "bruh no" to "Does that make sense?" were unclear; draft (fr): round 64 callers, "no cap 2k" (now "fr 2k") was saved with "fr"; draft (tbh to to be honest with you): round 65 callers, "tbh 2k" was saved whole, while "2k tbh" lost it; draft (truth be told to call it): round 66 callers, "in all honesty 2k", "call it 2k" and "call it a year" were saved whole, and "hand on heart, money" was said back; draft (so to speak to at least): round 67 callers, "mind you, my boss", "long story short, money" and "at least a year" were saved with their lead, and "you see" alone was heard as leaving; draft (if you ask me to believe it or not): round 68 callers, "in short 2k", "let's say a year" and "needless to say my boss" were saved with their lead, and "by and large money" was said back; draft (on the whole to admittedly): round 69 callers, "for the most part money", "admittedly a year" were saved with their lead; draft (in any case to btw): round 70 callers, "simply put, money", "in fact my boss" and "apparently a year" were saved with their lead
lead_not_before: [paid, "off", known, being, respected, rested, educated, quits, supply]   # draft: round 54 callers, "well paid job" was said back as "with paid job?": a filler lead before these is part of the answer; draft (quits): round 66, "call it" is a filler lead, but "call it quits" keeps it; draft (supply): round 68, "in short" is a filler lead, but "in short supply" keeps it
take_backs: ["no wait", "wait no", "no actually", "actually make it", "actually make that", "or actually", "i mean", "or rather", "scratch that"]   # draft: a self-correction: what came before it is taken back ("3 years, i mean 2 years" -> "2 years"; whole calls: the 3 was kept; round 25: "3k, actually make it 5k" kept the 3k, and "more money, actually no, more time" was said back whole)   # draft ("wait no"): round 50 callers, "money, wait no, time" was said back whole
take_backs_with_break: ["actually", "sorry", "wait", "well", "hang on", "hold on", "hang on a minute", "hold on a minute", "hang on a sec", "hold on a sec", "wait a sec", "wait a minute", "let me see", "let me think", "lemme see", "lemme think", "you know what", "for me", "true"]   # draft ("well"): round 27 callers, "more money, well, more time really" was said back whole; draft: the same, only with a break after it ("3 years, sorry, 2 years"): "sorry my dog is barking" and "hold on a second" take nothing back. Said first, it is cut off the words after it ("hang on a minute, that's a lot of money" is the money; whole calls: torn with a pause and saved as a yes); draft (let me see to you know what): round 57 callers, "let me see... money" got "with let you see?" and "you know what, quit" was saved whole; with no break ("let me see the price", "you know what I mean") nothing is cut; draft (for me): round 58 callers, "for me, quit" was saved whole; "for me it's money" keeps it; draft (true): round 61 callers, "true, money" was saved whole; only with a break, so "true freedom" stays
take_backs_mid: ["no", "actually no", "jk", "just kidding", "kidding", "lol no"]   # draft: a correction only between two answers, with a break both sides ("a year, no, two years" -> "two years"; whole calls: the year was kept); "no, credit?" at the start still says no; round 25: "more money, actually no, more time" was said back whole, and "actually no, forget it" still backs out   # draft (jk to lol no): round 26 callers, "a million, jk, 2k" was saved whole
denied_leads: ["not"]   # draft: round 51 callers, "not a year, two" was said back as "12 months": a first answer denied, then one of its kind ("not 2k, 3k", "not my boss, my wife"), keeps the second; "not really, I'm busy" stays whole
corrects: '^\W*(?:(?:sorry|oh|oops|wait|no|actually|so)\W+)*(?:i\s+meant(?:\s+to\s+say|(?!\s+to\b))|make\s+that)\b\W*'   # draft: a reply that fixes their last answer, a turn later ("sorry I meant 3k not 2k"; whole calls: saved as how long they had been thinking; "I meant to start ages ago" is no fix)
corrects_drop: '\W+(?:not|instead\s+of|rather\s+than)\b.*$'   # draft: the old answer named after the new one ("3k not 2k" -> "3k")
coach_notes: {step: "The seller is finding out about your {name}.", listen: "Listen for: {note}", default: "Answer honestly, then watch how the seller follows up."}   # the learner's coach note for each step (buy mode's "training" panel)
ack_words: [you, your, you're, you've, got, it, sounds, makes, sense, hear, that, tough, hard, sorry, okay, right, fair, understand, so, really, lot, see, why, must, be, can, totally, thanks, for, sharing, not, "no", easy, been, there, while]   # words the ack may add to the prospect's own; neutral or kind, never "great"
log_uncovered: true    # write uncovered product questions to the log
log_text_chars: 120    # longest piece of prospect text ever logged
prompts:   # AI prompt templates: {name} is filled in by the seller; an empty {memory} drops that part
  ack: |-
    You are the salesperson on a call. You asked:
    <question>{question}</question>
    They answered: <reply>{reply}</reply>
    {memory}Write one short sentence (at most {max_words} words) that shows you heard them, using their own words and speaking to them as 'you'. No question, no advice, no praise. Answer with the sentence only.
  listen: |-
    You are the salesperson on a call. You are finding out: <goal>{concept}</goal>
    You asked: <question>{question}</question>
    They answered: <reply>{reply}</reply>
    {memory}Reply with exactly three lines:
    ANSWERED: yes if the reply gives you the goal, even partly or in their own words; no if it is empty, a shrug ("idk", "k"), off the point or dodges it.
    ACK: when yes, one short sentence (at most {max_words} words) showing you heard them, using their own words, speaking to them as 'you', no question, no advice, no praise; else none.
    PROBE: when no, one simpler, more concrete question (at most {probe_words} words) that asks for the goal another way, or, when they said something unclear, asks what they mean by it; never the question's own wording; else none.
  ack_memory: |
    Earlier they told you:
    <earlier>
    {told}
    </earlier>
    If it fits naturally, link their answer to something they told you earlier.
  answer: |-
    You are the salesperson on a call. Programme facts:
    <facts>{facts}</facts>
    {memory}A prospect asked the question below.
    <question>{question}</question>
    Answer in one or two short sentences: warm, confident and helpful toward yes, linked to what they told you when it fits. Say only what the facts support. Never invent numbers, results, timeframes, promises, prices or links. Do not ask a question. If the facts don't answer it, reply with NOT_COVERED only.
  answer_memory: |
    What they told you earlier:
    <earlier>
    {told}
    </earlier>
  judge: |-
    A prospect replied to a sales question. Which meaning fits best?
    {options}
    - {vague}: none of these clearly fits
    Prospect reply: <reply>{reply}</reply>
    Answer with exactly one of: {answers}.
