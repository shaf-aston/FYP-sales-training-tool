# Script engine knobs. The engine reads these; it never hardcodes them.
method: cat            # default method (config/methods/<name>.yaml); a product may name its own
# Which practice products the script sells: the offer (config/offers/<name>.yaml) and, optionally, the method for each.
# A session asking for a product not listed here gets default_product.
products:
  high_ticket_sales_mentorship: {offer: shay_coaching, method: cat}
default_product: high_ticket_sales_mentorship   # used when a session names no listed product (the web UI never picks one)
embed_model: BAAI/bge-small-en-v1.5
embed_cache_dir: .cache/fastembed   # model files; relative to the project root, gitignored
embed_threads: 1       # CPU threads for the model; more threads use much more memory (free hosts have 512 MB)
embed_batch_size: 16   # texts embedded at once; smaller keeps peak memory low
threshold: 0.65        # lowest similarity that counts as a match
early_objection_min_score: 0.85   # before the price, a stated objection must match this well: "money", "scared", "risk" (about 0.7-0.81) are answers; "I can't afford it" (0.9+) is an objection
early_objection_judge_score: 0.78   # between this and the line above, the AI judges objection or answer ("10k seems like a lot" 0.81); AI down = answer
interrupt_threshold: 0.8   # on a step that takes any answer, an interruption must score this high
question_answer_min_score: 0.8   # a question is one of the step's answers only this sure: "can we do option 2?" (0.9) chooses, "what happens to the card?" (0.74) asks
near_miss: 0.1         # a top score this far under the threshold is a close call too
margin: 0.03           # top two labels closer than this = close call
close_call_k: 3        # candidates handed to the judge on a close call
unsure_margin: 0.12    # draft: a reply this much nearer not knowing (common_sense `unclear`) than its best answer is none: "maybe" (1.0 vs "yes" 0.87), not "I think so" (0.87 vs 0.87)
clause_breaks: [",", ";", ".", "!", "?", "and", "but", "so"]   # a long reply is also heard part by part, split at these: "to travel and work from bali and never have a boss" reads as its parts
clause_min_words: 3     # a part shorter than this is too little to hear on its own
max_words: 30          # longest sentence the AI may write
ai_retries: 1
ai_rest_seconds: 60    # after ai_fail_limit failures in a row, skip the AI this long (plain script lines meanwhile)
ai_fail_limit: 3       # failures in a row (any user) before the AI rests; one slow call must not silence it for everyone
ai_timeout_seconds: 2   # a slow AI call is abandoned; the turn uses the script line
ai_workers: 4          # AI calls in flight at once; an abandoned slow call keeps its worker until it ends
objection_entries: 2   # objections that get their matrix branch in one call; the next books the follow-up
slot_words: 6          # longest phrase echoed into a script blank
rise_answer_words: 6   # a part this short that ends in "?" but isn't phrased as a question, and has the step's `needs` ("dunno, a year?"), is the answer said with a rise
reason_starts: [because, cause, cos, coz, cuz, bc]   # draft: a reply opening like this is a reason: said with a rise ("because money is nice?") it is never a question, and before the price it is never an objection (whole calls: "because my kid just started school and money is tight" got "I haven't mentioned a price yet")
reason_backs: ["yes", yeah, yep, yup, yea, yeh, ya, okay, sure, alright, definitely, absolutely, certainly]   # draft: round 52 callers, "yes because I need the money" was heard as a money worry and "yeah because my wife wants it" as a partner one: a reason after these (or a short_replies form of one: "k", "ofc", "why not") only says why yes, so it raises no worry; "no because I can't afford it" still does
echo_term_words: 3     # outside a step marked `moment`, their words come back only as a term this short (echo.py)
echo_repeats: 2        # the same phrase of theirs is said back at most this many times a call
takes_back: ["no", not_yet, backs_out]   # shared answers (answers.yaml) that say no: "no, credit?" is torn, not paying (verdict `_takes_back`)
lead_repeats: 2        # a lead line ("No rush, even a rough idea helps.", "Fair enough, I'll keep this quick.") is said at most this many times a call, then left out
stop_words: [a, an, the, i, i'm, i've, my, me, to, of, and, or, in, "on", at, for, is, am, are, be, it, that, this, so, with, as, by, we, you, your, we're, we've, it's, that's, you're]   # draft (we're to you're): round 46 callers, "we're fine" to "Credit or debit?" got "Welcome aboard" ("i'm fine" was a shrug)
side_words: [in, "on", for, with]   # draft: round 46 callers, "I'm in" to "Do you see yourself jumping in?" was only stop words, so a shrug; with these ("I'm on it", "I'm with you") it says where they stand
filler_words: [ok, okay, sure, yeah, yep, "yes", hmm, mm, cool, alright, right, k, kk, idk, dunno, fr, frfr, lol, lmao, fine, ye, yeh, yea, yh, ya, mhm, mmm, certainly, absolutely, definitely, indeed, totally, jk, then, oh, ah, please, acha, okey, dokey, okie, dokie, exactly, precisely, hi, hey, damn, well, actually, omg, wow, yay, oof, jeez, argh, yup, ngl, imo]   # a reply made only of these (and stop_words) says nothing ("fine, but is this a scam?" answers nothing); never add "no", it answers yes/no steps; draft (ye to totally, jk): whole calls, "jk, more money" was said back as "jk more money";, "ye" and "Certainly." to an open question were saved as the answer; draft (then): round 44 callers, "alright then" and "ok then" to an open question were saved as the answer; draft (oh, ah, please, acha): round 47 callers, "oh sure", "please go on" and "acha ok" (Urdu and Hindi "ok") were saved as the answer at every step; draft (okey to dokie): round 48 callers, "okey-dokey" was saved as their reason; draft (exactly, precisely): round 49 callers, "exactly" was saved as their reason and "precisely more money" was said back; draft (hi, hey): round 51 callers, "hi, money" was said back as "with hi, money?"; draft (damn): round 53 callers, "ok damn" was saved as the answer at every open step; draft (well to argh): round 54 callers, "well ok", "actually ok" and "omg ok" to an open question were saved as the answer, and "actually money" was said back as "with actually money?"; draft (yup, ngl, imo): round 56 callers, "yup", "yuppp" and "ngl ok" to an open question were saved as the answer
no_answer_words: [hmm, mm, idk, dunno, lol, lmao, lmfao, haha, hahaha, rofl, sorry, rn, asap]   # draft: a reply made only of these (and stop_words) answers no yes-or-no question either ("lol" to "do you want that to dictate your results?" was heard as "no"); draft (sorry): whole calls, "sorry" alone to "Does that make sense?" was a pause, again and again; draft (rn, asap): round 52 callers, "ok rn" was saved as the answer and "more money rn" was said back whole
shrug_phrases: ["who knows", "hard to say", "beats me", "good question", "we'll see", "it is what it is", "your guess is as good as mine", "not sure what to say", "i haven't thought about it", "i can't think of anything", "fingers crossed", "touch wood", "knock on wood", "god willing", "up to you", "you tell me", "your call", "i don't mind", "i'm easy"]   # draft (i don't mind, i'm easy): round 66 callers, "I'm easy" was saved as the answer at every open step, and "I don't mind" as the reason at 05; draft (fingers crossed to your call): round 65 callers, "fingers crossed" and "you tell me" were saved as the answer, and "up to you" at 05 was heard as leaving; draft: round 64 callers, these say nothing and have no words to ask about: "who knows" got "What do you mean by who knows?"
no_words: ["no", nah, nope, naw, nay]   # draft: a reply made only of these (and stop_words) is a plain no, an answer, never an interruption (whole calls: "nah" was heard as "what do you mean?")
no_polite_words: [thanks, thank, thx, ty, cheers]   # draft: round 34 callers, "no thank you" to every open question was kept as the answer; with these a no is still a plain no to a yes-or-no question ("Open to being called out?" "no thanks"), to an open one it is `not_interested` (common_sense.yaml)
sense_over_after: [wait, follow_up]   # draft: round 33 callers, "sorry was driving, 2k" ended the call and "sorry kids were shouting, 2k" got "take your time": a pause or goodbye said in the past is over, so it is talk
sense_over_words: [was, were, had]   # draft: the words that put a pause or goodbye in the past
filler_tags: ["you get me", "you know", "you know what i mean", "innit", "right", "yeah", "ya know", "get me", "you feel me", "honestly", "truthfully", "is that ok", "is that okay", "is that alright", "is that fine", "if that's ok", "if that's okay", "if that helps", "if that's alright", "if that makes sense", "stuff you know", "stuff like that", "things like that", "if i think about it", "when i think about it", "now that i think about it", "come to think of it", "thinking about it", "realistically", "realistically speaking", "honestly speaking", "at the end of the day", "if i'm being real", "like everyone", "like everyone else", "like everybody", "like everybody else", "like most people", "same as everyone", "period", "max", granted]   # draft (if i think about it to if i'm being real): round 41 callers, "if I really think about it, about a year" was heard as "I need to think about it"   # draft (if that helps to if that makes sense): round 32 callers, "about two thousand a month, if that helps" got "You're welcome."; draft (to be honest to things like that): round 27 callers, "well, to be honest with you, more money" was said back as "be honest with you more money", and "pay rent and stuff you know" whole; draft (is that ok to if that's okay): round 25 replay, "credit, is that ok?" got "There's no right answer here"; "...bro, you get me?" is talk, not a question; draft (like everyone to same as everyone): round 47 callers, "quit, obviously, like everyone" was heard as who they want to be, so "who would you be?" was skipped; draft (period, max): round 67 callers, "my boss, period" and "a year, max" were saved whole; only after a comma, so "a short period" keeps its word; draft (granted): round 69 callers, "granted, 2k" was saved whole; cut only after a comma, so "granted time" keeps it
end_tags: ["to be honest", "to be honest with you", "tbh", "if i'm being honest", "if i'm honest", "in all honesty", "to be fair", "tbf", "if it works", "if possible", "if i can", "if all goes well", "if i'm lucky", "if that's fine", "damn it", "fr", "frfr", "ngl", "imo", "in my opinion", "please", "as i said", "like i said", "as i say", "like i say", "sure thing", "in a way", "in a sense", "in some ways", "proper", "literally", "personally", "for me personally", "or whatever", "and that", "if that makes sense", "if that make sense", "y'know", "ya know", "at the end of the day", "stuff like that", "and stuff like that", "and all that", "or something like that", "tho", "though", "anyway", "anyways", "so yeah", "big time", "mainly", "mostly", "ideally", "hopefully", "obviously", "basically", "seriously", "definitely", "pretty much", "more or less", "give or take", "lowkey", "highkey", "kind of thing", "that kind of thing", "sort of thing", "that sort of thing", "type thing", "that type of thing", "or anything", "or anything like that", "as well", "essentially", "ultimately", "generally", "usually", "to start with", "to begin with", "and whatnot", "whatnot", "etc", "and so on", "and so forth", "innit", "frankly", "bruh", "or thereabouts", "if not more", "or more", "and then some", inshallah, wallah, "god willing", "fingers crossed", "touch wood", "knock on wood", "truth be told", "at a push", "per se", "if anything", "hand on heart", "either way", "so to speak", "as it were", "for what it's worth", "for what its worth", "mind you", "you see", "in a nutshell", "full stop", "at the very least", "at least", "tops", "if you ask me", "all in all", "by and large", "in short", "if you will", "needless to say", "believe it or not", "and all", "as such", "let's say", "lets say", "on the whole", "for the most part", "all things considered", "at any rate", "first and foremost", "for starters", "deep down", "to some extent", "as i see it", "as far as i know", "when all is said and done", "admittedly", "in any case", "simply put", "as a matter of fact", "in fact", "in truth", "on balance", "in theory", "in practice", "at a guess", "i'd guess", presumably, apparently, "funnily enough", "as it happens", "by the way", btw, "if that", "at best", "at worst"]   # filler tags (moved from filler_tags) that are also cut off the end with no comma before them: they never finish what was said ("I don't want to be like everyone else" and "I answered honestly" keep theirs); draft (tbf to damn it): round 53 callers, "ok if it works" and "free tbh" were saved as the answer; draft (fr, frfr): round 55 callers, "money for real" was said back as "with money for real?"; draft (ngl to sure thing): round 56 callers, "2k ngl", "2k please", "a year like I said" and "2k sure thing" were saved whole, and "ok please" was heard as "take your time"; draft (in a way to proper): round 57 callers, "money in a way" was said back whole and "quit proper" got "wanting to quit proper?"; draft (literally to or something like that): round 58 callers, "money or whatever", "2k if that makes sense" and "ok and that" were saved whole, and "ok stuff like that" got "let me say that again" at every step; draft (tho to hopefully): round 59 callers, "money tho", "2k anyway", "a year hopefully" and "money big time" were saved whole, and "ok big time" got "You're welcome"; draft (obviously to highkey): round 60 callers, "money pretty much", "2k give or take" and "money basically" were saved whole, and "obviously ok" and "ok pretty much" were saved as the answer; never "for now" or "at this point": "not for now" would be a plain "not"; draft (kind of thing to to begin with): round 61 callers, "money kind of thing", "2k type thing", "money as well", "money or anything" and "2k generally" were saved whole; never "to start" ("I want to start" would be "I want"), "right now" ("not right now" is a later) or "too" ("me too"); draft (and whatnot to or thereabouts): round 62 callers, "money and whatnot", "2k etc", "money innit" and "2k or thereabouts" were saved whole, and "ok and so on" to "Does that make sense?" was unclear; never "no doubt" ("I have no doubt" would be "I have") or "at the moment" ("not at the moment" is a later); draft (if not more to and then some): round 63 callers, "money, if not more" and "money and then some" were said back whole; draft (inshallah to knock on wood): round 65 callers, "2k inshallah" and "money fingers crossed" were saved whole, and "money touch wood" got "achieve with money touch wood?"; draft (truth be told to either way): round 66 callers, "2k truth be told", "2k at a push", "2k per se" and "2k if anything" were saved whole, and "money if anything" was said back; draft (so to speak to tops): round 67 callers, "2k so to speak", "2k mind you", "2k tops" and "2k full stop" were saved whole, and "so to speak" alone was heard as "say that again"; draft (if you ask me to lets say): round 68 callers, "2k if you ask me", "2k by and large" and "my boss and all" were saved whole, and "as such" alone was heard as "let me put it another way" at every step; draft (on the whole to admittedly): round 69 callers, "2k on the whole" and "my boss to some extent" were saved whole, and "to some extent" alone was heard as "let me say that again" at every step; draft (in any case to at worst): round 70 callers, "2k in any case", "a year in practice", "2k if that" and "a year at best" were saved whole
tag_skip: [completely, totally, perfectly, brutally, really, quite, fully]   # draft: a tag still says nothing with one of these in it (round 41 callers: "to be completely honest, more money" was said back as "by being completely honest, more money?")
asked_back: {i: you, me: you, my: your, myself: yourself, mine: yours, "i'm": "you're", am: are}   # draft: the question said back about themselves is "what do you mean?" (whole calls: "what do I want to achieve?" got the AI line, "why can't I ignore it?" got "I'll find out")
asked_back_you: [you, your, yours, yourself, "you're", u, ur]   # draft: their own "you" asks about us ("what do you do?" has every word of "What do you want...?")
asked_back_what: [what, which, huh, eh, pardon]   # draft (which): round 26 callers, "which?" got "I'll find out"; draft: not counted as their words (whole calls: "how long what?" to "How long have you been thinking about this?" moved on without an answer)
what_alone_with: [sorry, wait, um, uh]   # draft: a reply of only these and asked_back_what words is "what do you mean?" (whole calls: "what?" was torn between "say that again" and "why do you ask", and got "I'll find out")
asked_back_share: 0.75   # draft: "what would it get me?" (4 of 5 words in "What are you hoping that would get you?") is; "how do I pay?" (2 of 4) is not
asked_back_share_with_answer: 0.6   # draft: round 31 callers, "what am I hoping to achieve? more money" (4 of 6 words) got "I'm the AI"; with their answer after it, a looser echo is still talk
asked_back_min_words: 2   # draft: "what would it change?" needs no I-word (whole calls: it got "I'll find out"); "why?" alone is too short to tell
word_back_skip: [per, each, every]   # draft: round 40 callers, "per month?" to "How much... each month?" got the payment plan line
word_back_ends: [s, ly]   # draft: "months?", "monthly?" lift "month" (round 40 callers: "monthly?" got the payment plan line)
clarify_starts: ["what do you mean", "what you mean", "what does that mean", "what does it mean", "meaning what"]   # draft: a question opening with these that nothing else heard wants the step put another way (round 40 callers: "what do you mean stopping me?" got "I'll find out")
word_back_words: 2   # draft: a word or two lifted from the question with a "?" ("a month?", "achieve?") asks what it means (whole calls: "a month?" got "I'll find out", "achieve?" got the AI line)
question_words: [what, who, where, when, why, which, how]   # a question word then a helper verb opens a question: "how do I know", "who are you"
question_subjects: [you, i, we, this, that, there, they, anyone, anybody]   # a helper verb then one of these opens a question: "is this legit", "can I", "have you got proof"
question_starts: ["is it", "does it", "will it", "can it", "was it", "how much", "how long", "how many", "how come", "is the", "does the", "can the", "will the", "what's the", "do people", "tell me", "just tell me", "how'd", "who's", "what about you", "how about you", "what about yourself", "how about yourself", "depends what", "depends on what", "it depends what", "it depends on what", "depends on the price", "depends on the cost", "depends how much", "depends on how much", "it depends on the price", "it depends on the cost", "it depends how much", "it depends on how much"]   # other phrases that open a question ("what about you" turns it back on us, "?" or not)  # draft: "depends what you're offering" asks what we offer (whole calls: got "What do you mean by depends what you're offering?")   # draft (depends on the price to it depends on how much): round 44 callers, "depends on the price" after the price got "let me put it another way"
closed_question_starts: [is, are, do, does, did, have, has, can, could, will, would, was, were, am, should, isn't, isnt, aren't, arent, don't, dont, doesn't, doesnt]   # helper verbs: a step asked this way wants a yes or no ("yes" or "ok" answers it, it is not a shrug), and they open a question
question_lead_words: [so, and, then, okay, ok, but, now, well, right, alright]   # draft: words before the helper verb that still leave a yes-or-no question ("So, if ..., then would this...?", "Okay, And do you...?")
