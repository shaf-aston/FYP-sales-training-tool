# Script engine knobs. The engine reads these; it never hardcodes them.
method: cat            # default method (config/methods/<name>.yaml); a product may name its own
# Which practice products the script sells: the offer (config/offers/<name>.yaml) and, optionally, the method for each.
# A session asking for a product not listed here gets default_product.
products:
  high_ticket_sales_mentorship: {offer: shay_coaching, method: cat}
default_product: high_ticket_sales_mentorship   # used when a session names no listed product (the web UI never picks one)
embed_model: BAAI/bge-small-en-v1.5
embed_cache_dir: .cache/fastembed   # model files; relative to the project root, gitignored
embed_threads: 1       # CPU threads for the model; more threads use much more memory (free hosts have 512 MB)
embed_batch_size: 16   # texts embedded at once; smaller keeps peak memory low
threshold: 0.65        # lowest similarity that counts as a match
early_objection_min_score: 0.85   # before the price, a stated objection must match this well: "money", "scared", "risk" (about 0.7-0.81) are answers; "I can't afford it" (0.9+) is an objection
early_objection_judge_score: 0.78   # between this and the line above, the AI judges objection or answer ("10k seems like a lot" 0.81); AI down = answer
interrupt_threshold: 0.8   # on a step that takes any answer, an interruption must score this high
question_answer_min_score: 0.8   # a question is one of the step's answers only this sure: "can we do option 2?" (0.9) chooses, "what happens to the card?" (0.74) asks
near_miss: 0.1         # a top score this far under the threshold is a close call too
margin: 0.03           # top two labels closer than this = close call
close_call_k: 3        # candidates handed to the judge on a close call
unsure_margin: 0.12    # draft: a reply this much nearer not knowing (common_sense `unclear`) than its best answer is none: "maybe" (1.0 vs "yes" 0.87), not "I think so" (0.87 vs 0.87)
clause_breaks: [",", ";", ".", "!", "?", "and", "but", "so"]   # a long reply is also heard part by part, split at these: "to travel and work from bali and never have a boss" reads as its parts
clause_min_words: 3     # a part shorter than this is too little to hear on its own
max_words: 30          # longest sentence the AI may write
ai_retries: 1
ai_rest_seconds: 60    # after ai_fail_limit failures in a row, skip the AI this long (plain script lines meanwhile)
ai_fail_limit: 3       # failures in a row (any user) before the AI rests; one slow call must not silence it for everyone
ai_timeout_seconds: 2   # a slow AI call is abandoned; the turn uses the script line
ai_workers: 4          # AI calls in flight at once; an abandoned slow call keeps its worker until it ends
objection_entries: 2   # objections that get their matrix branch in one call; the next books the follow-up
slot_words: 6          # longest phrase echoed into a script blank
rise_answer_words: 6   # a part this short that ends in "?" but isn't phrased as a question, and has the step's `needs` ("dunno, a year?"), is the answer said with a rise
reason_starts: [because, cause, cos, coz, cuz, bc]   # draft: a reply opening like this is a reason: said with a rise ("because money is nice?") it is never a question, and before the price it is never an objection (whole calls: "because my kid just started school and money is tight" got "I haven't mentioned a price yet")
echo_term_words: 3     # outside a step marked `moment`, their words come back only as a term this short (echo.py)
echo_repeats: 2        # the same phrase of theirs is said back at most this many times a call
takes_back: ["no", not_yet, backs_out]   # shared answers (answers.yaml) that say no: "no, credit?" is torn, not paying (verdict `_takes_back`)
lead_repeats: 2        # a lead line ("No rush, even a rough idea helps.", "Fair enough, I'll keep this quick.") is said at most this many times a call, then left out
stop_words: [a, an, the, i, i'm, i've, my, me, to, of, and, or, in, "on", at, for, is, am, are, be, it, that, this, so, with, as, by, we, you, your]
filler_words: [ok, okay, sure, yeah, yep, "yes", hmm, mm, cool, alright, right, k, kk, idk, dunno, fr, frfr, lol, lmao, fine, ye, yeh, yea, yh, ya, mhm, mmm, certainly, absolutely, definitely, indeed, totally, jk]   # a reply made only of these (and stop_words) says nothing ("fine, but is this a scam?" answers nothing); never add "no", it answers yes/no steps; draft (ye to totally, jk): whole calls, "jk, more money" was said back as "jk more money";, "ye" and "Certainly." to an open question were saved as the answer
no_answer_words: [hmm, mm, idk, dunno, lol, lmao, lmfao, haha, hahaha, rofl, sorry]   # draft: a reply made only of these (and stop_words) answers no yes-or-no question either ("lol" to "do you want that to dictate your results?" was heard as "no"); draft (sorry): whole calls, "sorry" alone to "Does that make sense?" was a pause, again and again
no_words: ["no", nah, nope, naw, nay]   # draft: a reply made only of these (and stop_words) is a plain no, an answer, never an interruption (whole calls: "nah" was heard as "what do you mean?")
no_polite_words: [thanks, thank, thx, ty, cheers]   # draft: round 34 callers, "no thank you" to every open question was kept as the answer; with these a no is still a plain no to a yes-or-no question ("Open to being called out?" "no thanks"), to an open one it is `not_interested` (common_sense.yaml)
sense_over_after: [wait, follow_up]   # draft: round 33 callers, "sorry was driving, 2k" ended the call and "sorry kids were shouting, 2k" got "take your time": a pause or goodbye said in the past is over, so it is talk
sense_over_words: [was, were, had]   # draft: the words that put a pause or goodbye in the past
filler_tags: ["you get me", "you know", "you know what i mean", "innit", "right", "yeah", "ya know", "get me", "you feel me", "is that ok", "is that okay", "is that alright", "is that fine", "if that's ok", "if that's okay", "if that helps", "if that's alright", "if that makes sense", "to be honest", "to be honest with you", "honestly", "tbh", "if i'm being honest", "if i'm honest", "in all honesty", "truthfully", "to be fair", "stuff you know", "stuff like that", "things like that"]   # draft (if that helps to if that makes sense): round 32 callers, "about two thousand a month, if that helps" got "You're welcome."; draft (to be honest to things like that): round 27 callers, "well, to be honest with you, more money" was said back as "be honest with you more money", and "pay rent and stuff you know" whole; draft (is that ok to if that's okay): round 25 replay, "credit, is that ok?" got "There's no right answer here"; "...bro, you get me?" is talk, not a question
asked_back: {i: you, me: you, my: your, myself: yourself, mine: yours, "i'm": "you're", am: are}   # draft: the question said back about themselves is "what do you mean?" (whole calls: "what do I want to achieve?" got the AI line, "why can't I ignore it?" got "I'll find out")
asked_back_you: [you, your, yours, yourself, "you're", u, ur]   # draft: their own "you" asks about us ("what do you do?" has every word of "What do you want...?")
asked_back_what: [what, which, huh, eh, pardon]   # draft (which): round 26 callers, "which?" got "I'll find out"; draft: not counted as their words (whole calls: "how long what?" to "How long have you been thinking about this?" moved on without an answer)
what_alone_with: [sorry, wait, um, uh]   # draft: a reply of only these and asked_back_what words is "what do you mean?" (whole calls: "what?" was torn between "say that again" and "why do you ask", and got "I'll find out")
asked_back_share: 0.75   # draft: "what would it get me?" (4 of 5 words in "What are you hoping that would get you?") is; "how do I pay?" (2 of 4) is not
asked_back_share_with_answer: 0.6   # draft: round 31 callers, "what am I hoping to achieve? more money" (4 of 6 words) got "I'm the AI"; with their answer after it, a looser echo is still talk
asked_back_min_words: 2   # draft: "what would it change?" needs no I-word (whole calls: it got "I'll find out"); "why?" alone is too short to tell
word_back_words: 2   # draft: a word or two lifted from the question with a "?" ("a month?", "achieve?") asks what it means (whole calls: "a month?" got "I'll find out", "achieve?" got the AI line)
question_words: [what, who, where, when, why, which, how]   # a question word then a helper verb opens a question: "how do I know", "who are you"
question_subjects: [you, i, we, this, that, there, they, anyone, anybody]   # a helper verb then one of these opens a question: "is this legit", "can I", "have you got proof"
question_starts: ["is it", "does it", "will it", "can it", "was it", "how much", "how long", "how many", "how come", "is the", "does the", "can the", "will the", "what's the", "do people", "tell me", "just tell me", "how'd", "who's", "what about you", "how about you", "what about yourself", "how about yourself", "depends what", "depends on what", "it depends what", "it depends on what"]   # other phrases that open a question ("what about you" turns it back on us, "?" or not)  # draft: "depends what you're offering" asks what we offer (whole calls: got "What do you mean by depends what you're offering?")
closed_question_starts: [is, are, do, does, did, have, has, can, could, will, would, was, were, am, should, isn't, isnt, aren't, arent, don't, dont, doesn't, doesnt]   # helper verbs: a step asked this way wants a yes or no ("yes" or "ok" answers it, it is not a shrug), and they open a question
question_lead_words: [so, and, then, okay, ok, but, now, well, right, alright]   # draft: words before the helper verb that still leave a yes-or-no question ("So, if ..., then would this...?", "Okay, And do you...?")
bad_phrase_starts: [it, its, "it's", "that's", "there's", own, to, not, "no", nothing, none, nope, nah, don't, dont, never, you, "you're", "you've", "you'd", "you'll", whatever, idk, dunno, "yes", yeah, ok, okay, finally, because, want, need, just, being, making, getting, working]   # a blank phrase starting like this is no goal and breaks the sentence; "nothing" is never said back
verb_goal_starts: [be, quit, stop, make, get, have, start, build, grow, save, create, see, travel, leave, retire, say, escape, ditch, fire, own, buy, pay, spend, support, help, live, work, earn, provide, move, do, go, reach]   # draft (reach): round 31, "reach out to more people" was "with reach out". A phrase starting with a verb is a verb-goal: a line's {name|noun form|verb form} blank then uses its verb form ("to be your own boss")
verb_goal_leads: [to, can, could]   # draft: a word they put after one of these is a verb ("I want to replace my salary", "so I can cut down my hours"), said back as one
be_goal_words: [free, rich, happy, comfortable, secure, independent, stable, wealthy, successful]   # draft: a goal ending in a state ("debt free") is a verb-goal with "be" in front: "to be debt free", not "to have debt free"
echo_drop_starts: ["could i possibly say", "could i say", "can i say", "i'd say", "i would say", "oh", "ah", "more like", "being able to", "be able to", "i want", "i'd like", "i would like", "i'd love", "we'd love", "we'd like", "we want", "we need", "i just want", "i need", "i'm after", "honestly", "basically", "probably", "just", "mainly", "mostly", "well", "so", "um", "uh", "for", "really", "to", "want to", "wanna", "whatever", "like", "fine", "ok", "okay", "alright", "yeah", "obviously", "so that i can", "so i can", "i can", "i could", "maybe", "kind of", "sort of", "wallah", "inshallah", "sorry", "bro", "same as everyone", "same as everybody", "same as anyone", "the usual"]   # draft (could i possibly say to i would say): round 32 callers, "Could I possibly say more money, please?" was "with could you possibly say more money?"; draft (same as everyone to the usual): round 30 callers, "same as everyone, money" was said back whole; draft (kind of to bro): whole calls, "kind of more money" was said back with "kind of"; draft (oh, ah): whole calls, "oh ok, more money I guess" was said back as "oh ok more money"; draft (maybe): whole calls, "IDK MAYBE 2K A MONTH EXTRA" was said back as "maybe 2k a month extra"; draft (so that i can to i could): "so I can travel" -> "travel". Lead-ins dropped before their words go into a blank: "I want financial freedom" -> "financial freedom"; live: "fine. more money obviously" was said back whole
echo_drop_ends: ["whatever", "honestly", "to be honest", "tbh", "really", "i guess", "i think", "i suppose", "maybe", "probably", "kind of", "sort of", "or something", "lol", "haha", "obviously", "mate", "basically", "inshallah", "bro", "sorry", "thank you", "thanks", "please", "cheers", "idk", "dunno", "lmao", "duh", "what else", "stupid question", "dumb question", "silly question"]   # draft ("idk" to "silly question"): round 37 callers, "idk more money idk" was said back as "with more money idk?" and "money obviously, stupid question" whole; draft ("thank you" to "cheers"): round 31, "more money, thank you" was said back whole; draft ("basically"): "more money basically" -> "more money". Hedges dropped from the end: "freedom I guess" -> "freedom", not "freedom you guess"
echo_not_with: [is, are, was, were, been, am, "isn't", "aren't", "wasn't", said, told]   # draft: a phrase with one of these is a sentence about their life, not a goal to say back (whole calls: "with money has been tight?"); draft (said, told): round 33 callers, "what I said" was said back as "to have what you said" (a goal example for it took "for my kids")
prospect_pronouns: [i, "i'm", "i've", "i'd", me, my, mine, myself]   # the seller would be speaking as the prospect
spell_cutoff: 0.85     # how close a typo must be to a known word to be fixed before it is said back
spell_min_letters: 5   # shorter words are left alone: too easy to "fix" into the wrong word
spell_swap_min_letters: 3   # draft: two letters the wrong way round is a typo even in a short word (whole calls: "mroe money" was said back, "yse" was not a yes)
spell_word_endings: [s, es, ed, d, ing, er, ers, ly]   # a known word plus one of these is a real word, never "fixed"
flip_leads: ["no yeah", "nah yeah", "no yes", "yeah no", "yeah nah", "yes no"]   # draft: round 28 callers, "no yeah" (a yes) was heard as backing out; only the last word counts, and only before a break or the end ("yeah no worries" is as typed)
short_replies: {y: "yes", n: "no", yh: "yeah", ys: "yes", nop: "nope", deb: "debit", cred: "credit", quit: "quit my job", bet: "yes", safe: "ok", "say less": "yes"}   # draft (bet, safe, say less): round 36 callers, slang "bet" at "jumping in?" was unclear and "safe" (ok) was kept as the answer at every open step; draft (quit): round 30 callers, "quit" alone at a goal step was heard as leaving the call; draft: a reply of only one of these is its word (whole calls: "y" to "Do you see yourself jumping in?" was not a yes)
money_signs_as: money   # draft: round 28 callers, "more £££" was said back as "with more?"
emoji_words: {"💰": money, "💵": money, "💸": money, "🤑": money, "🏠": a house, "🏡": a house}   # draft: round 31 callers, "💰💰💰" said nothing and "🏠 for my family" was unclear
word_swaps: {"to by": "to buy", "by a house": "buy a house", "by a car": "buy a car", "to grand": "two grand", "board of": "bored of", "board with": "bored with", "some one": "someone", "quiet my job": "quit my job", "dosh": "money", "skint": "broke"}   # draft: round 31 callers, voice to text (and round 28 autocorrect: "quiet my job"); round 32 slang ("loads more dosh" got the plain line) ("I want to by a house" was said back as typed)
spell_words: [freedom, financial, family, retire, retirement, independence, business, boss, travel, wealth, security, money, income, kids, children, house, mortgage, debt, career, passive, year]   # draft: year (whole calls: "a yaer" was not a time). Extra words typos are fixed to, beside every word in the script's examples
spell_real_words: "script/real_words.txt"   # draft: real English words, never "fixed" as typos (whole calls: "just not drown in debt" was saved as "down in debt")
number_words: {a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, eighteen: 18, fifteen: 15, twenty: 20, couple: 2}   # a number said in words: "a year", "two years", "a couple of years"
number_half: "and a half"   # draft: after the unit ("a year and a half") or before it ("2 and a half years"), half is added
number_parts: {half: 0.5}   # draft: a share said before the number ("half a year" -> 6 months; whole calls: it was read as a year)
number_skip: [of]   # dropped before a number is read, so "a couple of years" reads "a couple years"
number_blanks:   # blanks filled with the number they said before a unit, as digits: "about 5 years" -> {years} = 5
  years:
    units: [year, years, yr, yrs, y]   # draft: y (whole calls: "2y")
  years_said:   # the same number with its unit, singular for one: "1 year", "2 years"
    from: years
    unit: [year, years]
  months_thinking:   # the same answer counted in months: "2 years" -> 24, "six months" -> 6
    from: years
    per: {year: 12, years: 12, yr: 12, yrs: 12, y: 12, month: 1, months: 1, mo: 1, mos: 1, mth: 1, mths: 1}   # draft: mo, mth (whole calls: "18mo")
    unit: [month, months]   # draft: "1 month", never "1 months" (whole calls: "a month" got "1 months... Damn.")
echo_want_words: [need, needs, want, wants, wanna, "would like", "i'd like", "we'd like", "would love", "i'd love", "we'd love"]   # draft: round 28 callers, "my family needs more money" was said back as "your family needs more money"
echo_want_within: 4   # draft: who wants it is at most this many words ("my wife and I want")
form_joins: {"being able to be ": "being "}   # draft: round 29 callers, "I'd like to be rich" and "debt free" were said back as "by being able to be rich"
echo_want_objects: [me, us, him, her, them]   # draft: round 29 callers, "my husband wants me to earn more" got the plain line; who it is wanted of is left out too
echo_list_joins: [plus, "+", "&"]   # draft: round 31 callers, "money plus time plus freedom" was said back with "plus"; said back as "money, time and freedom"
echo_drop_verbs: [achieve, reach, attain, gain, obtain]   # draft: round 31 callers, "I would like to achieve financial independence" got "What are you hoping to achieve by being able to achieve financial independence?"; the thing is said back, not the verb
echo_drop_verbs_not_before: [out, to, for, up, more, my, your, our, the, a, an]   # draft: "reach out to people", "achieve more" and "reach my goals" keep it
echo_drop_words: [fucking, fuckin, effing, bloody, damn, damned, freaking, frickin, bleeding]   # draft: round 29 callers, "more f***ing money" was said back as "more f ing money"; swear words are never said back (words with stars in them never are)
echo_cut_at: [but, though, although, except, because, cos, coz, cuz]   # draft (because to cuz): round 27 callers, "more money because like rent" was said back whole; draft: their words said back stop here: whole calls, "quit your job but you're scared?"
echo_pronoun_swap: {my: your, me: you, mine: yours, myself: yourself, "i'm": "you're", "i've": "you've", "i'd": "you'd", i: you}   # their first person said back to them: "my kids" -> "your kids"
judge_examples: 2     # examples per candidate shown to the judge
judge_tokens: 10       # max_tokens for a close-call judge
answer_tokens: 60      # max_tokens for an uncovered product answer
bridge_ack: "Good to know."   # draft wording: said after their reply to a step's `bridge` question, before the step's own question
uncovered_fallback: "I don't know that one offhand, I'll find out and let you know."   # draft wording
answer_banned_words: [guarantee, guaranteed, guarantees, promise, promises, promised, overnight, days, weeks, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, twenty, thirty, fifty, hundred, hundreds, thousand, thousands, million, millions, percent, earn, earns, earned, earning, income, salary, profit, profits, revenue, free, trial, refund, refunds, discount, discounts, contract, contracts, cancel, cancellation, lifetime, module, modules, daily, weekly, monthly, www, com, http, https]   # a product answer never promises, sizes results, sets timeframes, makes up a policy or a feature, or sends links (words the offer facts use are allowed)
ack: true             # before the next scripted line, one short AI sentence showing their answer was heard (none when it fails a check)
listen: true          # on a step that captures an answer and takes any reply, the AI hears for the step's concept (its note): a miss gets a fresh probe for it, up to `misses` times, then the call moves on
listen_tokens: 90     # max_tokens for the listen call (three short lines)
probe_max_words: 18   # longest probe the AI may ask
misses: 2             # times a step that captures an answer is asked again (each time in other words) when the reply says nothing or misses its concept; then the call moves on without saving it
fact_presses: 3     # draft: a fact asked this many times before the price gets its `pressed` line (offer facts)
openers: ["Okay"]   # draft: a word that opened the last message too is left off this one: the owner's matrix lines open "Okay." four times in a row
vague_words: [maybe, eh, hmm, um, umm, ummm, lol, haha, bro, man, mate, tbh, honestly, really, guess, know, sure, idea, clue, depends, think, question, good, anything, something, just, like, suppose, mean, let, sorry, kind, sort, inshallah, wallah, because, cos, coz, cuz, bc]   # a reply made only of these (and stop/filler words) is a shrug: nothing to ask "what do you mean by". Never "whatever" or "meh": those are frustration; draft (let): whole calls, "hmm let me think" got "What do you mean by hmm let you think?"; draft (sorry to wallah): whole calls, "sorry", "kind of" and "inshallah" alone were saved as the answer at every step; draft (because to bc): round 34 callers, "because" alone was saved as the answer at every open step
ack_max_words: 12
ack_tokens: 30
ack_retries: 0        # one try: a turn never waits on two ack calls
memory_chars: 120     # longest piece of an earlier answer handed to the AI as memory
banned_phrases: [but, you said, any questions]   # no AI sentence may contain these (whole words): "but" undoes what was just said, "you said" quotes them back, "any questions" ends the call
nudge_leads: [so, ok, okay]   # words allowed before a nudge: "so, what's next?"
nudge_after_break: [next, continue, carry on, move on]   # draft: round 30 nudges that end a sentence too ("what happens next?", "I want to carry on"): cut only alone or after a comma or stop
ask_leads: ["i was wondering if", "i was wondering whether", "i was wondering", "i'm wondering if", "i'm wondering", "i wonder if", "i wonder", "i'd like to know", "i would like to know", "i'd love to know", "i want to know", "i just want to know"]   # draft: a polite lead before a question is cut off, so the question is heard alone (whole calls: "I'd like to know the price first" was saved as their goal, "I was wondering how this works" was heard as the scam worry)
unsure_leads: ["i guess", "i suppose", "i think", "maybe", "probably", "perhaps", "possibly"]   # draft: round 26 callers, "I guess my car loan?" got "I'll find out": a "?" after these is an unsure answer, not a question
aside_starts: ["sorry for", "sorry about", "apologies for", "excuse the", "pardon the"]   # draft: a part opening like this is an aside, never what they meant (whole calls: "sorry for the long message but basically I work in retail..." got "What do you mean by sorry for the long message?")
answer_leads: ["would it be ok if i said", "would it be ok if i say", "would it be ok to say", "is it ok if i say", "is it ok if i said", "is it ok to say", "is it okay to say", "would it be okay to say", "is it ok if", "would it be ok if", "is it okay if", "would it be okay if", "i already told you", "i told you already", "told you already", "i just told you", "like i told you", "as i told you", "i told you", "i already said", "i said already", "i've already said"]   # draft (i already told you to i've already said): round 37 callers, "I told you, my job" was heard as "what do you mean?" and the job lost; draft: a lead asking leave to answer is cut off, and its "?" with it: the rest is the answer (whole calls: "is it ok to say quit my job?" got the hours fact, "would it be ok to say yes?" got "I'll find out")
take_backs: ["no wait", "no actually", "actually make it", "actually make that", "or actually", "i mean", "or rather", "scratch that"]   # draft: a self-correction: what came before it is taken back ("3 years, i mean 2 years" -> "2 years"; whole calls: the 3 was kept; round 25: "3k, actually make it 5k" kept the 3k, and "more money, actually no, more time" was said back whole)
take_backs_with_break: ["actually", "sorry", "wait", "well", "hang on", "hold on", "hang on a minute", "hold on a minute", "hang on a sec", "hold on a sec", "wait a sec", "wait a minute"]   # draft ("well"): round 27 callers, "more money, well, more time really" was said back whole; draft: the same, only with a break after it ("3 years, sorry, 2 years"): "sorry my dog is barking" and "hold on a second" take nothing back. Said first, it is cut off the words after it ("hang on a minute, that's a lot of money" is the money; whole calls: torn with a pause and saved as a yes)
take_backs_mid: ["no", "actually no", "jk", "just kidding", "kidding", "lol no"]   # draft: a correction only between two answers, with a break both sides ("a year, no, two years" -> "two years"; whole calls: the year was kept); "no, credit?" at the start still says no; round 25: "more money, actually no, more time" was said back whole, and "actually no, forget it" still backs out   # draft (jk to lol no): round 26 callers, "a million, jk, 2k" was saved whole
corrects: '^\W*(?:(?:sorry|oh|oops|wait|no|actually|so)\W+)*(?:i\s+meant(?:\s+to\s+say|(?!\s+to\b))|make\s+that)\b\W*'   # draft: a reply that fixes their last answer, a turn later ("sorry I meant 3k not 2k"; whole calls: saved as how long they had been thinking; "I meant to start ages ago" is no fix)
corrects_drop: '\W+(?:not|instead\s+of|rather\s+than)\b.*$'   # draft: the old answer named after the new one ("3k not 2k" -> "3k")
coach_notes: {step: "The seller is finding out about your {name}.", listen: "Listen for: {note}", default: "Answer honestly, then watch how the seller follows up."}   # the learner's coach note for each step (buy mode's "training" panel)
ack_words: [you, your, you're, you've, got, it, sounds, makes, sense, hear, that, tough, hard, sorry, okay, right, fair, understand, so, really, lot, see, why, must, be, can, totally, thanks, for, sharing, not, "no", easy, been, there, while]   # words the ack may add to the prospect's own; neutral or kind, never "great"
log_uncovered: true    # write uncovered product questions to the log
log_text_chars: 120    # longest piece of prospect text ever logged
prompts:   # AI prompt templates: {name} is filled in by the seller; an empty {memory} drops that part
  ack: |-
    You are the salesperson on a call. You asked:
    <question>{question}</question>
    They answered: <reply>{reply}</reply>
    {memory}Write one short sentence (at most {max_words} words) that shows you heard them, using their own words and speaking to them as 'you'. No question, no advice, no praise. Answer with the sentence only.
  listen: |-
    You are the salesperson on a call. You are finding out: <goal>{concept}</goal>
    You asked: <question>{question}</question>
    They answered: <reply>{reply}</reply>
    {memory}Reply with exactly three lines:
    ANSWERED: yes if the reply gives you the goal, even partly or in their own words; no if it is empty, a shrug ("idk", "k"), off the point or dodges it.
    ACK: when yes, one short sentence (at most {max_words} words) showing you heard them, using their own words, speaking to them as 'you', no question, no advice, no praise; else none.
    PROBE: when no, one simpler, more concrete question (at most {probe_words} words) that asks for the goal another way, or, when they said something unclear, asks what they mean by it; never the question's own wording; else none.
  ack_memory: |
    Earlier they told you:
    <earlier>
    {told}
    </earlier>
    If it fits naturally, link their answer to something they told you earlier.
  answer: |-
    You are the salesperson on a call. Programme facts:
    <facts>{facts}</facts>
    {memory}A prospect asked the question below.
    <question>{question}</question>
    Answer in one or two short sentences: warm, confident and helpful toward yes, linked to what they told you when it fits. Say only what the facts support. Never invent numbers, results, timeframes, promises, prices or links. Do not ask a question. If the facts don't answer it, reply with NOT_COVERED only.
  answer_memory: |
    What they told you earlier:
    <earlier>
    {told}
    </earlier>
  judge: |-
    A prospect replied to a sales question. Which meaning fits best?
    {options}
    - {vague}: none of these clearly fits
    Prospect reply: <reply>{reply}</reply>
    Answer with exactly one of: {answers}.
