# Script engine knobs. The engine reads these; it never hardcodes them.
method: cat            # default method (config/methods/<name>.yaml); a product may name its own
# Which practice products the script sells: the offer (config/offers/<name>.yaml) and, optionally, the method for each.
# A session asking for a product not listed here gets default_product.
products:
  high_ticket_sales_mentorship: {offer: shay_coaching, method: cat}
default_product: high_ticket_sales_mentorship   # used when a session names no listed product (the web UI never picks one)
embed_model: BAAI/bge-small-en-v1.5
embed_cache_dir: .cache/fastembed   # model files; relative to the project root, gitignored
embed_threads: 1       # CPU threads for the model; more threads use much more memory (free hosts have 512 MB)
embed_batch_size: 16   # texts embedded at once; smaller keeps peak memory low
threshold: 0.65        # lowest similarity that counts as a match
interrupt_threshold: 0.8   # on a step that takes any answer, an interruption must score this high
near_miss: 0.1         # a top score this far under the threshold is a close call too
margin: 0.03           # top two labels closer than this = close call
close_call_k: 3        # candidates handed to the judge on a close call
max_words: 30          # longest sentence the AI may write
ai_retries: 1
ai_rest_seconds: 60    # after ai_fail_limit failures in a row, skip the AI this long (plain script lines meanwhile)
ai_fail_limit: 3       # failures in a row (any user) before the AI rests; one slow call must not silence it for everyone
ai_timeout_seconds: 2   # a slow AI call is abandoned; the turn uses the script line
ai_workers: 4          # AI calls in flight at once; an abandoned slow call keeps its worker until it ends
objection_loops: 2     # loop twice, third time go direct
slot_words: 6          # longest phrase the AI may put into a script blank
stop_words: [a, an, the, i, i'm, i've, my, me, to, of, and, or, in, on, at, for, is, am, are, be, it, that, this, so, with, as, by, we, you, your]
filler_words: [ok, okay, sure, yeah, yep, yes, hmm, mm, cool, alright, right, k]   # a reply made only of these (and stop_words) says nothing; never add "no", it answers yes/no steps
filler_tags: ["you get me", "you know", "you know what i mean", "innit", "right", "yeah", "ya know", "get me", "you feel me"]   # "...bro, you get me?" is talk, not a question
question_starts: ["how much", "how long is", "how long does", "how many", "do you", "does it", "does the", "is it", "is there", "are there", "are you", "can i", "can you", "will i", "will it", "what does it", "what do you", "what is the", "what's the", "where are you", "when does", "who is", "do people", "does this", "has anyone", "will this"]   # phrases that open a question
ai_fill_blanks: false   # AI fills {blanks} from the prospect's words; off = always the plain line (live tests: AI phrases often read wrong)
bad_phrase_starts: [own, to, not, "no", nothing, none, nope, nah, don't, dont, never, you, idk, dunno, "yes", yeah, ok, okay, finally, because, want, need, just, being, making, getting, working]   # a blank phrase starting like this is no goal and breaks the sentence; "nothing" is never said back
verb_goal_starts: [be, quit, stop, make, get, have, start, build, grow, save, create, see, travel, leave, retire, buy, pay, spend, support, help, live, work, earn, provide, move, do, go]   # a phrase starting with a verb is a verb-goal: a line's {name|noun form|verb form} blank then uses its verb form ("to be your own boss"); the AI-filled noun blanks refuse these
echo_drop_starts: ["i want", "i'd like", "i would like", "i just want", "i need", "i'm after", "honestly", "basically", "probably", "just", "mainly", "mostly", "well", "so", "um", "uh", "for", "really", "to", "want to", "wanna"]   # lead-ins dropped before their words go into a blank: "I want financial freedom" -> "financial freedom"
prospect_pronouns: [i, "i'm", "i've", "i'd", me, my, mine, myself]   # the seller would be speaking as the prospect
echo_pronoun_swap: {my: your, me: you, mine: yours, myself: yourself, "i'm": "you're", "i've": "you've", "i'd": "you'd", i: you}   # their first person said back to them: "my kids" -> "your kids"
slot_tokens: 20        # max_tokens for a blank-filling call
judge_examples: 2     # examples per candidate shown to the judge
judge_tokens: 10       # max_tokens for a close-call judge
answer_tokens: 60      # max_tokens for an uncovered product answer
uncovered_fallback: "I don't know that one offhand, I'll find out and let you know."   # draft wording
answer_banned_words: [guarantee, guaranteed, guarantees, promise, promises, promised, overnight, days, weeks, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, twenty, thirty, fifty, hundred, hundreds, thousand, thousands, million, millions, percent, earn, earns, earned, earning, income, salary, profit, profits, revenue, free, trial, refund, refunds, discount, discounts, contract, contracts, cancel, cancellation, lifetime, module, modules, daily, weekly, monthly, www, com, http, https]   # a product answer never promises, sizes results, sets timeframes, makes up a policy or a feature, or sends links (words the offer facts use are allowed)
ack: true             # before the next scripted line, one short AI sentence showing their answer was heard (none when it fails a check)
ack_max_words: 12
ack_tokens: 30
ack_retries: 0        # one try: a turn never waits on two ack calls
memory_chars: 120     # longest piece of an earlier answer handed to the AI as memory
banned_phrases: [but, you said, any questions]   # no AI sentence may contain these (whole words): "but" undoes what was just said, "you said" quotes them back, "any questions" ends the call
nudge_leads: [so, ok, okay]   # words allowed before a nudge: "so, what's next?"
coach_notes: {step: "Script step {title}.", listen: "Listen for: {note}", default: "Listen to their answer."}   # the learner's coach note for each step (buy mode's "training" panel)
ack_words: [you, your, you're, you've, got, it, sounds, makes, sense, hear, that, tough, hard, sorry, okay, right, fair, understand, so, really, lot, see, why, must, be, can, totally, thanks, for, sharing, not, no, easy, been, there, while]   # words the ack may add to the prospect's own; neutral or kind, never "great"
log_uncovered: true    # write uncovered product questions to the log
log_text_chars: 120    # longest piece of prospect text ever logged
prompts:   # AI prompt templates: {name} is filled in by the seller; an empty {memory} drops that part
  ack: |-
    You are the salesperson on a call. You asked:
    <question>{question}</question>
    They answered: <reply>{reply}</reply>
    {memory}Write one short sentence (at most {max_words} words) that shows you heard them, using their own words and speaking to them as 'you'. No question, no advice, no praise. Answer with the sentence only.
  ack_memory: |
    Earlier they told you:
    <earlier>
    {told}
    </earlier>
    If it fits naturally, link their answer to something they told you earlier.
  answer: |-
    You are the salesperson on a call. Programme facts:
    <facts>{facts}</facts>
    {memory}A prospect asked the question below.
    <question>{question}</question>
    Answer in one or two short sentences: warm, confident and helpful toward yes, linked to what they told you when it fits. Say only what the facts support. Never invent numbers, results, timeframes, promises, prices or links. Do not ask a question. If the facts don't answer it, reply with NOT_COVERED only.
  answer_memory: |
    What they told you earlier:
    <earlier>
    {told}
    </earlier>
  fill: |-
    Fill the blank so the sentence reads naturally, like a person talking. Use a short noun phrase (at most {slot_words} words) made only of words the prospect said. If nothing fits naturally, answer NONE.
    Sentence: {sentence}
    Prospect said: <reply>{reply}</reply>
    Answer with the phrase only.
  judge: |-
    A prospect replied to a sales question. Which meaning fits best?
    {options}
    - {vague}: none of these clearly fits
    Prospect reply: <reply>{reply}</reply>
    Answer with exactly one of: {answers}.
