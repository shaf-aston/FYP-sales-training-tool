# Quiz: buy mode asks where the AI seller is in its script and what it should do next
# (core/quiz.py); sell mode replays one of the learner's own turns.

# Points and score bands for the rule-based quiz scores (0-100). The rules set the score; the AI only adds wording.
scoring:
  alignment_bands: [45, 75]          # next-move score below the first = weak, at or above the second = strong
  understanding_bands: [45, 70, 85]  # direction score -> needs_work / partial / good / excellent
  coverage_good: 0.5                 # share of key concepts named before the praise line is shown
  coverage_points: {next_move: 45, direction: 50}   # points for naming every key concept
  length_points: {full_words: 10, full: 15, part_words: 6, part: 8, short: 2}   # by answer word count
  next_move_points: {context: 8, open_question: 15, action: 8, neither: 2}
  direction_points: {reasoning: 12, plan: 13, missing: 4}
  stage_partial_credit: 0.5          # stage OR approach right, not both
  llm_fallback_score: 50             # used when the AI gives no score

# Words the rule-based scoring looks for (whole words, skipped when negated).
words:
  # Ignored when matching key concepts and the customer's last message (only words over 3 letters count).
  stopwords: [and, the, that, this, with, from, into, your, their, they, them, what, when, where, which,
              would, should, could, about, while, there, have, been, just, only, more, less]
  open_question: [what, how, why, which, where, when, who]   # with a "?", the next move is an open question
  action: [ask, explore, clarify, understand, discover, probe, uncover, confirm]
  reasoning: [because, so that, therefore, which means, this helps]
  plan: [first, next, then, after that, from there]

# Rubric per strategy and stage (the script's ui_stage). Every stage in core/enums.py needs one.
stages:
  consultative:
    intent:
      goal: "Complete the INTENT stage by confirming the user's goal and context"
      advance_when: "Advance when INTENT is clear enough to switch or progress"
      key_concepts:
        - "Open-ended discovery questions"
        - "Match user's energy"
        - "No pitching yet"
        - "Listen for tangible goals"

    logical:
      goal: "Complete the LOGICAL stage by surfacing a clear problem and doubt"
      advance_when: "Advance when LOGICAL conditions are met"
      key_concepts:
        - "Two-phase probe (cause then like/dislike)"
        - "Never state problem for them"
        - "Create doubt in current approach"
        - "Max 1 question per turn"

    emotional:
      goal: "Complete the EMOTIONAL stage by surfacing stakes and consequences"
      advance_when: "Advance when EMOTIONAL stakes are clear"
      key_concepts:
        - "Identity frame (why change now)"
        - "Future pacing (what would be different)"
        - "Consequence of inaction"
        - "Connect to personal stakes"

    pitch:
      goal: "Complete the PITCH stage by presenting the offer at the right time"
      advance_when: "Advance when PITCH leads to commitment or objection"
      key_concepts:
        - "Get micro-commitment first"
        - "Three pillars tied to stated goals"
        - "Assumptive close"
        - "No trailing questions"

    outcome:
      goal: "Complete the OUTCOME stage"
      advance_when: "Stage objectives are met"
      key_concepts:
        - "Listen actively"
        - "Ask relevant questions"

# Plain-English names for stage and strategy ids. The only place they are defined;
# everything the learner reads (quiz feedback, expected answers) goes through these.
stage_names:
  intent: "Finding out what they want"
  logical: "Understanding the problem"
  emotional: "Making it personal"
  pitch: "Presenting the solution"
  outcome: "Closing"

strategy_names:
  consultative: "Consultative"

# What the learner reads after a buy-mode quiz answer. {stage}, {strategy} and {concept} are filled in.
feedback:
  stage:
    both_right: "Right - {stage}, {strategy} approach."
    both_wrong: "Not this time - it's {stage} ({strategy} approach)."
    strategy_only: "The approach is right ({strategy}), but you're in {stage} now."
    stage_only: "The stage is right ({stage}), but this is the {strategy} approach."
  concepts_named: "Response referenced key stage concepts."
  concept_missing: "Include this missing concept: {concept}."
  coach_tip_concept: "Focus next on this concept: {concept}."
  next_move:
    bands:   # by alignment band: weak, partial, strong
      - "This next move is too generic for the current stage."
      - "Partly aligned, but tighten stage focus."
      - "Strong next move for this stage."
    context_used: "Response connected to the customer's stated context."
    context_missing: "Reference one concrete detail from the customer's last message."
    open_question: "Used an open question to keep discovery moving."
    no_open_question: "Use one open question to move the conversation forward."
    coach_tip: "Keep one open question tied to the customer's last message."
  direction:
    bands:   # by alignment band: weak, partial, strong
      - "Direction is unclear and misses stage priorities."
      - "Direction is partly clear, but needs stronger stage linkage."
      - "Strong strategic direction for this stage."
    reasoning: "Explained why this direction fits."
    no_reasoning: "Explain why this direction fits the stage goal."
    plan: "Outlined a clear next-step sequence."
    no_plan: "Name a clear order for your next steps."
    coach_tip: "State the next step and why it moves the stage forward."
  ai_unavailable: "Unable to evaluate."   # the AI's feedback when it gave none; never shown

# AI prompts for the wording the AI may add to a buy-mode quiz answer.
# {stage}, {strategy}, {goal}, {advance_when}, {concepts}, {customer} and {answer} are filled in.
prompts:
  next_move: |-
    Grade the learner's response in {stage} ({strategy}).
    Goal: {goal} | Concepts: {concepts}
    <customer>{customer}</customer>
    <learner>{answer}</learner>
    JSON: {{"score": <0-100>, "alignment": "strong|partial|weak", "feedback": "<brief>", "strengths": ["..."], "improvements": ["..."]}}
  direction: |-
    Evaluate the learner's understanding in {stage} ({strategy}).
    Goal: {goal} | Advance: {advance_when} | Concepts: {concepts}
    <learner>{answer}</learner>
    JSON: {{"score": <0-100>, "understanding": "excellent|good|partial|needs_work", "feedback": "<brief>", "key_concepts_got": ["..."], "key_concepts_missed": ["..."]}}

# Sell mode: the learner is the seller, so the quiz replays one of their own
# turns. {turn} and {line} are filled in from their session.
sell_question: 'On turn {turn} you said: "{line}" - what would you say instead to get the buyer talking?'
# {old} and {new} are the 1-5 ratings of the original line and the replacement.
sell_feedback:
  better: "Better than what you said ({old} out of 5, now {new})."
  same: "About as strong as what you said ({old} out of 5)."
  worse: "Weaker than what you said ({old} out of 5, now {new})."

# Quiz question templates by type. `default` is asked for a type with no list of its own.
questions:
  stage:
    - "Which stage of the sale are we in right now?"
    - "Based on the conversation so far, which stage of the sale and which approach are active?"
    - "Can you identify the current stage of the sale and the approach?"
    - "Where are we in the sale (stage and approach)?"

  next_move:
    - "What would you say next to this customer?"
    - "How would you respond to their last message?"
    - "As the salesperson, what's your next response?"
    - "Given the conversation so far, what would be an effective next message?"

  direction:
    - "Where are you taking this conversation and why?"
    - "What's your strategy for moving forward from here?"
    - "Explain your approach for the next few turns."
    - "What are you trying to achieve and how will you get there?"

  default:
    - "How would you proceed?"
