# The offer being sold. Method scripts take their blanks from here.
# draft: true = answer is not verbatim from the trainer's source and needs the trainer's wording.
months: 6
price: "$5k"
context: b2c   # b2c or b2b
# What the AI may say about the programme when no fact below covers a question. Only what the
# facts and the pitch steps already say: anything else gets the honest "I'll find out" line.
about:
  draft: true  # gathered from the facts and the pitch lines; needs the trainer's check
  text: "We coach people through a 6-month programme to build their own business. Education & curriculum: structured, step by step, so there's no wasted time piecing it together. Mentorship: direct coaching and tailored feedback to avoid the landmines. Accountability: we tell you what you need to hear and hold you to it. We work with people all around the world. Results depend on the work you put in."
pillars:
  - "Education & curriculum"
  - "Mentorship"
  - "Accountability"
facts:
  price:
    draft: true  # late_answer is not from the trainer's source
    examples:
      - "how much does it cost"
      - "what's the price"
      - "what do you charge"
      - "can you give me a ballpark figure"
    answer: "I'm happy to share a range, but first a couple of questions to make sure we can even help you."
    late_answer: "It's a {months}-month process and the investment is {price}."
  what_we_do:
    draft: true
    examples:
      - "what do you do"
      - "what is this about"
      - "what exactly are you offering"
    answer: "We coach people through a 6-month programme to build their own business. First, a couple of questions to make sure we can even help you."
  length:
    draft: true
    examples:
      - "how long is the programme"
      - "how many months does it run"
      - "how long does it last"
    answer: "It's a 6-month process."
  location:
    examples:
      - "where are you based"
      - "do you work with people in my country"
      - "is this only for people in the UK"
      - "can I join from abroad"
    answer: "We work with people all around the world."
  fit:
    draft: true
    examples:
      - "do people like me actually make it work"
      - "has anyone like me done this"
      - "will this work for me"
      - "does this work for beginners"
      - "is this for people with no experience"
    answer: "That's exactly what these questions are for: to see if we can even help you."
