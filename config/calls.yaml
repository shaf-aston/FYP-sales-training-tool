# Reading an uploaded sales-call transcript (core/calls). Every rule the reader uses lives here; the code
# only applies them. No AI: the same transcript always gives the same speakers, rep and prospect profile.

# Speaker labels that name no one: the profile then calls the prospect `fallback_name`.
anonymous_speakers: ["^speaker\\s*(\\d+|[a-z])?$", "^unknown(\\s+speaker)?$", "^participant\\s*\\d*$", "^guest\\s*\\d*$", "^caller\\s*\\d*$", "^customer$", "^prospect$", "^client$", "^lead$"]
fallback_name: "Prospect"

# Which speaker is the rep (the learner). Without a name from the learner, the rep is the speaker who asks the
# most questions: sentences ending in "?", or opening with one of `ask_starts` (requests that ask without a "?").
# `sure_ratio` is how many times more than the next speaker that must be to trust it.
rep:
  sure_ratio: 1.5
  ask_starts: ["tell me", "walk me through", "talk me through", "help me understand", "take me through"]

# Header lines that are not part of the conversation (titles, links, footers some tools add).
# Lines that are only a tool's junk, dropped wherever they are. Seen in real exports: Fathom (title, VIEW RECORDING,
# ---), Otter ("Transcribed by"), Google Meet (disclaimer, "Transcription ended after"), Teams ("X started
# transcription"). Kept narrow: a line someone said must never match (VTT cue ids and NOTE blocks need no entry,
# the cue parser never reads them).
noise: ["^webvtt$", "^transcript$", "^meeting (notes|recording|transcript)\\b", "^https?://\\S+$", "editable transcript was computer generated", "^people can also change the text", "^attendees$", "^-{3,}$", "^view recording\\b", "^transcribed by https?://", "^(meeting|transcription) ended after \\d", "\\b(started|stopped) transcription$"]
# A tool's marker in front of real speech: cut off, the speech kept (Fathom "BOOKMARK: x - WATCH: <url> what was said").
noise_prefixes: ["^(bookmark|highlight|action items?): .*?- watch: \\S+ ?"]

# The prospect's own sentences say these things. Patterns are regular expressions, matched case-insensitively
# on one sentence at a time; a match with a negation just before it ("I'm not worried") does not count.
# Objection types must be the buyer's concern types in buyer.yaml (real_objections.type_map); a test checks it.
objections:
  price: ["\\b(too|so|quite|bit|a little) (expensive|pricey|much)\\b", "\\bcan'?t afford\\b", "\\bout of (my|our) (budget|price range)\\b", "\\bmore than (i|we) (wanted|planned|budgeted|expected)\\b", "\\b(cost|price|investment) is (high|steep|a lot)\\b", "\\bthat'?s a lot( of money)?\\b", "\\bno budget\\b"]
  skepticism: ["\\b(sounds|seems) too good\\b", "\\bis (this|it) a scam\\b", "\\bhow do i know\\b", "\\b(don'?t|not sure i) (trust|believe)\\b", "\\bheard that before\\b", "\\bprove it\\b", "\\b(is there|any|what'?s the) (guarantee|reviews|case studies|proof)\\b", "\\bburn(ed|t) before\\b"]
  timing: ["\\b(need|have|want|got|'?ll|'?d) to think (about it|it over|on it)\\b", "\\blet me think\\b", "\\bnot (the )?right (time|now)\\b", "\\b(maybe|probably) (next|later this) (month|quarter|year)\\b", "\\bcircle back\\b", "\\bget back to you\\b", "\\bsleep on it\\b", "\\bnot in a rush\\b", "\\btoo busy (right now|at the moment|for this)\\b"]
  partner: ["\\b(talk|speak|check) (to|with) my (wife|husband|partner|boss|team|business partner|co-?founder|manager)\\b", "\\b(run it|run this) (by|past)\\b", "\\bask my (wife|husband|partner|boss|manager)\\b", "\\bmy (wife|husband|partner|boss|manager) (would|will) (need|have|want) to\\b", "\\bnot my (decision|call)\\b", "\\bsign[- ]off\\b"]
  fear: ["\\b(scared|afraid|nervous|worried)\\b", "\\bwhat if (it|this|i)\\b", "\\bnot sure (i|it) (can|will|would) work\\b", "\\bfailed before\\b", "\\b(tried|done) (this|that|something like this) before\\b", "\\bnot confident\\b", "\\b(too|seems|sounds|feels|bit|quite) risky\\b"]

# What the prospect says about themselves and what they want.
background: ["\\bi(?:'m| am) (an?|the) (?!bit\\b|little\\b|lot\\b|few\\b|big fan\\b)\\w+", "\\bi (work|worked) (as|at|in|for)\\b", "\\bi (run|own|started|founded|manage)\\b", "\\bmy (business|company|agency|team|store|shop|practice)\\b(?! partner)", "\\bwe(?:'re| are) an? (?!bit\\b|little\\b)\\w+"]
needs: ["\\b(i|we) (want|need|would like|'d like) to\\b", "\\b(i|we)(?:'m| am|'re| are) (looking|hoping|trying) (for|to)\\b", "\\b(my|our|the) (goal|aim|priority) is\\b", "\\bwhat (i|we) (really )?want is\\b"]
pains: ["\\bstruggl", "\\bfrustrat", "\\bstuck\\b", "(?<!no )\\b(problem|issue)s?\\b", "\\bhard to\\b", "\\bcan'?t (seem|get|find|keep)\\b", "\\blosing\\b", "\\bwast(e|ing)\\b", "\\bstress", "\\b(tired|sick) of\\b", "\\bnot working\\b", "\\boverwhelm", "\\bburn(ed|t)? out\\b", "\\bfalling behind\\b"]
# A budget: a sum of money in a sentence about what they can put towards this ("£3k set aside", "we could spend
# £2k"), so a revenue goal ("add £10k a month") or past income ("we made $50k") is not read as what they can pay.
budget_words: ["\\bbudget", "\\bset aside\\b", "\\bafford\\b", "\\b(could|can|would|willing to|happy to|able to) (spend|pay|invest|put)\\b", "\\bput (aside|towards)\\b"]
money: "(?:[£$€] ?\\d[\\d,.]*(?: ?(?:k|m|grand|thousand|million))?|\\b\\d[\\d,.]*(?: ?(?:k|grand|thousand|million|pounds|dollars|euros|quid|bucks))\\b)"

# How hard a buyer they were. Points: one per objection and per push-back sentence; `short_reply_words` or
# fewer words per reply on average adds `short_reply_points`. Up to `easy_max` points is easy, up to
# `medium_max` medium, more is hard.
difficulty:
  pushback: ["^no\\b(?! (problem|worries|doubt)\\b)", "\\bnot (really|sure|interested)\\b", "\\bi don'?t think\\b", "\\bwhy would i\\b", "\\bwhat'?s the catch\\b", "\\bwe already (have|use)\\b"]
  short_reply_words: 8
  short_reply_points: 2
  easy_max: 1
  medium_max: 4

# How they come across, from how they talk. A trait is used when its stat is at least / at most the number;
# the texts are joined in this order. Stats: avg_words (per reply), questions, pushback, hedges (counts).
personality:
  traits:
    - {stat: avg_words, at_most: 8, text: "Gives short answers and makes you work for detail"}
    - {stat: avg_words, at_least: 25, text: "Talks freely and shares a lot of context"}
    - {stat: questions, at_least: 3, text: "asks plenty of questions"}
    - {stat: pushback, at_least: 2, text: "pushes back before agreeing to anything"}
    - {stat: hedges, at_least: 2, text: "hedges and keeps options open"}
  default: "Open to the conversation but needs a reason to move forward"
hedges: ["\\bmaybe\\b", "\\bi guess\\b", "\\bperhaps\\b", "\\bkind of\\b", "\\bsort of\\b", "\\bprobably\\b", "\\bnot sure\\b", "\\bi suppose\\b"]

# Labelling a recording's segments by voice (core/calls/audio.py): the AI sees numbered segments and answers one
# "number. A" or "number. B" line each. {context} repeats the last few labelled segments; {segments} are new.
speaker_prompt: |
  These are numbered pieces of a recorded sales call between two people, A and B, in order. Speech-to-text does not
  say who spoke, so decide it from what is said: questions and answers, who explains the offer, who talks about their
  own business, greetings, and turn-taking. A piece usually continues the same speaker unless the content changes hands.
  The first person to speak in the call is A.

  Already labelled, for continuity:
  {context}

  Label each of these. Answer only with one line per piece, like "14. B", nothing else.
  {segments}
