# Signals: keyword groups that drive stage moves and strategy choice.
# This file is the only source; code holds no backup copy.
# Matching is whole-word, case-insensitive, and skips a phrase when a negation
# ("not", "don't", ...) sits within three words before it.
# Keep entries specific: a word that also appears in ordinary questions
# ("but", "ok", "question") moves stages by accident.

# Buyer agrees to go ahead. Ends PITCH / NEGOTIATION / OBJECTION.
commitment:
  - ready to go
  - i'm ready
  - let's go
  - let's do it
  - let's do this
  - let's proceed
  - let's get started
  - let's move forward
  - sign me up
  - sign up
  - i'll take it
  - i'm in
  - count me in
  - i'm sold
  - we'll go with
  - send the agreement
  - send over the agreement
  - send over the contract
  - where do i sign
  - how do i pay
  - how do i start

# Buyer pushes back. Jumps to OBJECTION once past INTENT.
objection:
  - too expensive
  - too much
  - expensive
  - can't afford
  - out of our budget
  - over budget
  - pricey
  - not convinced
  - not sure it
  - concerned
  - worried
  - skeptical
  - sceptical
  - hesitant
  - risky
  - talk to my partner
  - talk to my business partner
  - ask my boss
  - check with my
  - run it by
  - next quarter
  - not the right time
  - bad timing
  - need to think
  - think about it
  - wait until
  - already use
  - already have
  - happy with our current
  - happy with what we have
  - tried this before
  - what's the catch
  - how do i know it works

# Buyer ends the conversation. Ends OBJECTION.
walking:
  - not interested
  - not for me
  - no thanks
  - no thank you
  - i'll pass
  - i'm out
  - forget it
  - not happening
  - we're done here
  - stop calling

low_intent:
  - just browsing
  - just looking
  - window shopping
  - just curious
  - no rush
  - not urgent
  - just exploring

# Buyer states a need. Moves INTENT forward.
high_intent:
  - need to buy
  - looking for
  - looking at options
  - looking to
  - trying to find
  - need a
  - need help
  - need something
  - in the market
  - shopping for
  - evaluating
  - comparing
  - want to
  - interested in
  - ready to buy

emotional_disclosure:
  - frustrated
  - stressed
  - worried
  - anxious
  - overwhelmed
  - struggling
  - fed up
  - exhausted
  - losing sleep
  - pressure
  - nightmare
  - drowning

guardedness_keywords:
  agreement_words:
    - ok
    - okay
    - sure
    - alright
    - yes
    - yep
    - yeah
    - sounds good
    - that's fine
  dismissal:
    - whatever
    - nope
    - nah
    - forget it
    - doesn't matter
    - never mind
  evasive:
    - maybe
    - not sure
    - possibly
    - perhaps
    - i guess
    - sort of
    - kind of
  sarcasm:
    - yeah right
    - oh sure
  deflection:
    - it depends
    - hard to say
    - complicated
    - case by case
  defensive:
    - that's not what i meant
    - i already said
    - you don't understand
    - you're not listening

demand_directness:
  - get to the point
  - just tell me
  - bottom line
  - cut to the chase
  - straight answer
  - be direct
  - stop dodging

# Buyer asks for price or terms. Allows price talk; moves transactional INTENT to PITCH.
direct_info_requests:
  - how much
  - price
  - pricing
  - cost
  - what's it cost
  - what does it cost
  - what do you charge
  - quote
  - fee
  - set me back

soft_positive:
  - that's nice
  - sounds good
  - sounds useful
  - interesting
  - good point
  - fair point
  - makes sense

validation_phrases:
  - makes sense
  - i understand
  - i get it
  - understood
  - got it
  - that's fair
  - i hear you

user_consultativeSIGNALS:
  - tell me more
  - explain
  - help me understand
  - walk me through
  - what would you recommend

user_transactionalSIGNALS:
  - just show me
  - quick answer
  - get straight
  - what's the price
